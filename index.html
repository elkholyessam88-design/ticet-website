<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"

<title>Ticket Branches</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #17181c;
  color: white;
}

body {
  min-height: 100vh;
}

.hidden {
  display: none !important;
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  cursor: pointer;
  font-weight: bold;
  font-size: 15px;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

input,
select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #555;
  background: #303136;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus,
select:focus {
  border-color: #8b5cf6;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  color: #ddd;
}

/* =========================
   LOGIN
========================= */

#loginScreen {

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;

  background:
    radial-gradient(
      circle at top,
      #30245b,
      #17181c 50%
    );
}

.login-box {

  width: 100%;

  max-width: 420px;

  padding: 35px;

  background: #202126;

  border: 1px solid #444;

  border-radius: 22px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.4);

}

.login-box h1 {

  text-align: center;

  margin-top: 0;

}

.login-box h1 span {

  color: #8b5cf6;

}

.login-subtitle {

  text-align: center;

  color: #aaa;

  margin-bottom: 25px;

}

#loginBtn {

  width: 100%;

  margin-top: 20px;

  background: #8b5cf6;

  color: white;

}

#loginError {

  min-height: 20px;

  text-align: center;

  color: #ff6b6b;

}

/* =========================
   HEADER
========================= */

header {

  padding: 18px 25px;

  background: #202126;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 20px;

  border-bottom: 1px solid #444;

  position: sticky;

  top: 0;

  z-index: 10;

}

header h1 {

  margin: 0;

  font-size: 27px;

}

header h1 span {

  color: #8b5cf6;

}

.user-area {

  display: flex;

  align-items: center;

  gap: 12px;

}

#userName {

  color: #ddd;

  font-size: 14px;

}

#userRole {

  color: #9b7cff;

  font-weight: bold;

  font-size: 13px;

}

.logout {

  background: #55565d;

  color: white;

}

/* =========================
   CONTAINER
========================= */

.container {

  max-width: 1100px;

  margin: 30px auto;

  padding: 20px;

}

.card {

  background: #202126;

  border: 1px solid #444;

  border-radius: 18px;

  padding: 25px;

  margin-bottom: 25px;

}

.branch {

  border: 1px solid #444;

  border-radius: 15px;

  padding: 20px;

  margin-top: 20px;

  background: #1c1d21;

}

.branch h3 {

  color: #9b7cff;

  margin-top: 0;

}

.row {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 12px;

}

.green {

  background: #008f68;

  color: white;

  margin-top: 20px;

}

.purple {

  background: #8b5cf6;

  color: white;

  margin-top: 20px;

}

.result-box {

  background: #1c1d21;

  border: 1px solid #444;

  border-radius: 14px;

  padding: 18px;

  margin-top: 15px;

  line-height: 1.8;

}

/* =========================
   HOST
========================= */

#hostTicketsCard {

  display: none;

  border-color: #8b5cf6;

}

body.host-user #hostTicketsCard {

  display: block !important;

}

body.host-user #ticketHandoverCard {

  display: none !important;

}

/* =========================
   LIVE INDICATOR
========================= */

.live {

  display: inline-flex;

  align-items: center;

  gap: 7px;

  color: #4ade80;

  font-size: 13px;

  font-weight: bold;

  margin-bottom: 15px;

}

.live-dot {

  width: 9px;

  height: 9px;

  border-radius: 50%;

  background: #4ade80;

  box-shadow:
    0 0 10px #4ade80;

}

/* =========================
   SUCCESS
========================= */

.ticket-success {

  animation:
    successPop .5s ease;

}

@keyframes successPop {

  0% {

    transform: scale(.97);

    opacity: .5;

  }

  50% {

    transform: scale(1.02);

  }

  100% {

    transform: scale(1);

    opacity: 1;

  }

}

.success-message {

  color: #4ade80;

  min-height: 20px;

  font-weight: bold;

}

/* =========================
   TABLET
========================= */

@media
(min-width: 701px)
and
(max-width: 1100px) {

  .container {

    max-width: 95%;

  }

  .row {

    grid-template-columns:
      repeat(2, 1fr);

  }

}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  header {

    position: relative;

    flex-direction: column;

    text-align: center;

  }

  .user-area {

    justify-content: center;

    flex-wrap: wrap;

  }

  .container {

    margin: 15px auto;

    padding: 12px;

  }

  .card {

    padding: 18px;

  }

  .row {

    grid-template-columns: 1fr;

  }

  header h1 {

    font-size: 23px;

  }

}

</style>

</head>

<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script>


/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://ubaooclkpgminlbifpjf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_iNL7NMiqyDKAUCmUYNKqpQ_rpOi12EB";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   STATE
================================================== */

let currentUser = null;

let currentBranch = "";

let isAllUser = false;


/* ==================================================
   ELEMENTS
================================================== */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const website =
  document.getElementById(
    "website"
  );

const loginEmail =
  document.getElementById(
    "loginEmail"
  );

const loginPassword =
  document.getElementById(
    "loginPassword"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const loginError =
  document.getElementById(
    "loginError"
  );


/* ==================================================
   DATE
================================================== */

function today() {

  const d =
    new Date();

  return (
    d.getFullYear() +
    "-" +
    String(
      d.getMonth() + 1
    ).padStart(2,"0") +
    "-" +
    String(
      d.getDate()
    ).padStart(2,"0")
  );

}


function setDates() {

  const d = today();

  document.getElementById(
    "date"
  ).value = d;

  document.getElementById(
    "searchDate"
  ).value = d;

  document.getElementById(
    "ticketDate"
  ).value = d;

  document.getElementById(
    "hostTicketDate"
  ).value = d;

}


/* ==================================================
   SHOW USER
================================================== */

async function loadUserProfile(user) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("branch_users")
      .select("branch")
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if (error) {

    console.error(error);

    throw error;

  }


  if (!data) {

    throw new Error(
      "User is not assigned to a branch."
    );

  }


  currentUser =
    user;

  currentBranch =
    data.branch;

  isAllUser =
    String(
      currentBranch
    ).toUpperCase() === "ALL";


  document.getElementById(
    "userName"
  ).textContent =
    user.email;


  document.getElementById(
    "userRole"
  ).textContent =
    isAllUser
      ? "HOST — ALL BRANCHES"
      : currentBranch;


  if (isAllUser) {

    document.body.classList.add(
      "host-user"
    );

    document.getElementById(
      "branch"
    ).disabled = false;

  }

  else {

    document.body.classList.remove(
      "host-user"
    );

    document.getElementById(
      "branch"
    ).value =
      currentBranch;

    document.getElementById(
      "branch"
    ).disabled = true;

  }

}


/* ==================================================
   OPEN WEBSITE
================================================== */

async function openWebsite(user) {

  await loadUserProfile(user);

  loginScreen.style.display =
    "none";

  website.classList.remove(
    "hidden"
  );

  document.body.classList.remove(
    "logged-out"
  );

  setDates();

  calculateOfflineCash();


  /*
    Host:
    automatically load today's tickets
  */

  if (isAllUser) {

    await loadHostTickets();

  }

}


/* ==================================================
   LOGIN
================================================== */

async function login() {

  loginError.textContent = "";

  const email =
    loginEmail.value.trim();

  const password =
    loginPassword.value;


  if (!email || !password) {

    loginError.textContent =
      "Enter email and password.";

    return;

  }


  loginBtn.disabled = true;

  loginBtn.textContent =
    "Logging in...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email: email,

          password: password

        });


    if (error) {

      loginError.textContent =
        "Invalid login credentials.";

      console.error(error);

      return;

    }


    await openWebsite(
      data.user
    );

  }

  catch (error) {

    console.error(error);

    loginError.textContent =
      error.message ||
      "Login failed.";

  }

  finally {

    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "Login";

  }

}


/* ==================================================
   LOGIN CLICK
================================================== */

loginBtn.addEventListener(
  "click",
  login
);


/* ==================================================
   ENTER LOGIN
================================================== */

loginPassword.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      login();

    }

  }
);


/* ==================================================
   CHECK EXISTING SESSION
================================================== */

async function checkSession() {

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();


  if (error) {

    console.error(error);

    return;

  }


  if (
    data &&
    data.session &&
    data.session.user
  ) {

    try {

      await openWebsite(
        data.session.user
      );

    }

    catch (error) {

      console.error(error);

      await supabaseClient.auth.signOut();

    }

  }

}


/* ==================================================
   AUTH STATE
================================================== */

supabaseClient.auth
  .onAuthStateChange(
    async function(
      event,
      session
    ) {

      if (
        event ===
        "SIGNED_IN" &&
        session &&
        session.user
      ) {

        try {

          await openWebsite(
            session.user
          );

        }

        catch (error) {

          console.error(error);

        }

      }


      if (
        event ===
        "SIGNED_OUT"
      ) {

        currentUser =
          null;

        currentBranch =
          "";

        isAllUser =
          false;

        website.classList.add(
          "hidden"
        );

        loginScreen.style.display =
          "flex";

      }

    }
  );


/* ==================================================
   LOGOUT
================================================== */

document.getElementById(
  "logoutBtn"
).addEventListener(
  "click",
  async function() {

    await supabaseClient.auth.signOut();

  }
);


/* ==================================================
   PRICES
================================================== */

const PRICES = {

  "Premium Orbit": 1500,

  "Fanpit": 1200,

  "VIP": 800,

  "High Regular": 500

};


/* ==================================================
   OFFLINE CASH
================================================== */

function calculateOfflineCash() {

  const premium =
    Number(
      document.getElementById(
        "offlinePremium"
      ).value || 0
    );

  const fanpit =
    Number(
      document.getElementById(
        "offlineFanpit"
      ).value || 0
    );

  const vip =
    Number(
      document.getElementById(
        "offlineVIP"
      ).value || 0
    );

  const high =
    Number(
      document.getElementById(
        "offlineHigh"
      ).value || 0
    );


  const total =

    premium * 1500 +

    fanpit * 1200 +

    vip * 800 +

    high * 500;


  document.getElementById(
    "offlineCash"
  ).value =
    total;


  return total;

}


[
  "offlinePremium",
  "offlineFanpit",
  "offlineVIP",
  "offlineHigh"
].forEach(
  function(id) {

    document.getElementById(
      id
    ).addEventListener(
      "input",
      calculateOfflineCash
    );

  }
);


/* ==================================================
   SAVE SALES
================================================== */

async function saveData() {

  const date =
    document.getElementById(
      "date"
    ).value;

  const branch =
    document.getElementById(
      "branch"
    ).value;


  if (!date) {

    alert(
      "Select date."
    );

    return;

  }


  const button =
    document.getElementById(
      "saveDataBtn"
    );

  const message =
    document.getElementById(
      "saveMessage"
    );


  button.disabled = true;

  button.textContent =
    "Saving...";


  const data = {

    sale_date:
      date,

    branch:
      branch,

    online_premium:
      Number(
        document.getElementById(
          "onlinePremium"
        ).value || 0
      ),

    online_fanpit:
      Number(
        document.getElementById(
          "onlineFanpit"
        ).value || 0
      ),

    online_vip:
      Number(
        document.getElementById(
          "onlineVIP"
        ).value || 0
      ),

    online_high_regular:
      Number(
        document.getElementById(
          "onlineHigh"
        ).value || 0
      ),

    offline_premium:
      Number(
        document.getElementById(
          "offlinePremium"
        ).value || 0
      ),

    offline_fanpit:
      Number(
        document.getElementById(
          "offlineFanpit"
        ).value || 0
      ),

    offline_vip:
      Number(
        document.getElementById(
          "offlineVIP"
        ).value || 0
      ),

    offline_high_regular:
      Number(
        document.getElementById(
          "offlineHigh"
        ).value || 0
      ),

    offline_cash:
      calculateOfflineCash()

  };


  try {

    const {
      data: existing,
      error: findError
    } =
      await supabaseClient
        .from("ticket_sales")
        .select("id")
        .eq(
          "sale_date",
          date
        )
        .eq(
          "branch",
          branch
        )
        .maybeSingle();


    if (findError)
      throw findError;


    let error = null;


    if (existing) {

      const result =
        await supabaseClient
          .from("ticket_sales")
          .update(data)
          .eq(
            "id",
            existing.id
          );

      error =
        result.error;

    }

    else {

      const result =
        await supabaseClient
          .from("ticket_sales")
          .insert([
            data
          ]);

      error =
        result.error;

    }


    if (error)
      throw error;


    message.style.color =
      "#4ade80";

    message.textContent =
      "✓ Data saved successfully";

  }

  catch (error) {

    console.error(error);

    message.style.color =
      "#ff6b6b";

    message.textContent =
      "❌ " +
      error.message;

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      "Save Data";

  }

}


document.getElementById(
  "saveDataBtn"
).addEventListener(
  "click",
  saveData
);


/* ==================================================
   SEARCH SALES
================================================== */

async function searchDay() {

  const date =
    document.getElementById(
      "searchDate"
    ).value;

  const results =
    document.getElementById(
      "results"
    );


  if (!date) {

    alert(
      "Select date."

/* ==================================================
   SAVE TICKET
================================================== */

async function saveTicket() {

  if (isAllUser)
    return;


  const date =
    document.getElementById(
      "ticketDate"
    ).value;

  const name =
    document.getElementById(
      "customerName"
    ).value.trim();

  const serial =
    document.getElementById(
      "ticketSerial"
    ).value.trim();

  const type =
    document.getElementById(
      "ticketType"
    ).value;

  const gmail =
    document.getElementById(
      "customerGmail"
    ).value.trim();

  const phone =
    document.getElementById(
      "customerPhone"
    ).value.trim();

  const saleType =
    document.getElementById(
      "saleType"
    ).value;


  const message =
    document.getElementById(
      "ticketMessage"
    );


  if (
    !date ||
    !name ||
    !serial ||
    !gmail ||
    !phone
  ) {

    message.style.color =
      "#ff6b6b";

    message.textContent =
      "Please fill all fields.";

    return;

  }


  const button =
    document.getElementById(
      "saveTicketBtn"
    );


  button.disabled = true;

  button.textContent =
    "Saving...";


  try {

    const ticket = {

      sale_date:
        date,

      branch:
        currentBranch,

      customer_name:
        name,

      serial:
        serial,

      ticket_type:
        type,

      gmail:
        gmail,

      phone:
        phone,

      sale_type:
        saleType

    };


    const {
      error
    } =
      await supabaseClient
        .from(
          "ticket_handover"
        )
        .insert([
          ticket
        ]);


    if (error)
      throw error;


    message.style.color =
      "#4ade80";

    message.textContent =
      "✓ Ticket saved successfully";


    const card =
      document.getElementById(
        "ticketHandoverCard"
      );


    card.classList.remove(
      "ticket-success"
    );


    void card.offsetWidth;


    card.classList.add(
      "ticket-success"
    );


    playSuccessSound();


    document.getElementById(
      "customerName"
    ).value = "";

    document.getElementById(
      "ticketSerial"
    ).value = "";

    document.getElementById(
      "customerGmail"
    ).value = "";

    document.getElementById(
      "customerPhone"
    ).value = "";


  }

  catch (error) {

    console.error(error);

    message.style.color =
      "#ff6b6b";

    message.textContent =
      "❌ " +
      error.message;

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      "Save Ticket";

  }

}


document.getElementById(

);

      .from(

        "sale_date",

      )

/* ==================================================
   SUCCESS SOUND
================================================== */

function playSuccessSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext)
      return;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      700;


    gain.gain.setValueAtTime(
      .001,
      audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .15,
      audio.currentTime + .02
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime + .3
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.start();


    oscillator.stop(
      audio.currentTime + .3
    );

  }

  catch (error) {

    console.log(
      "Audio unavailable"
    );

  }

}
