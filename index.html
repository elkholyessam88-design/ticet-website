<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Ticket Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:
        linear-gradient(
            135deg,
            #06111d,
            #0b1d2d,
            #07131f
        );

    color:white;
    min-height:100vh;
}

button,
input,
select{
    font-family:Arial,sans-serif;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

input,
select{
    width:100%;
    padding:13px 14px;

    border:1px solid #263f53;
    border-radius:10px;

    outline:none;

    background:#122536;
    color:white;
}

input:focus,
select:focus{
    border-color:#38bdf8;
    box-shadow:0 0 0 2px rgba(56,189,248,.12);
}

.hidden{
    display:none !important;
}


/* =====================================================
   LOGIN
===================================================== */

#loginPage{
    min-height:100vh;

    background:
        linear-gradient(
            rgba(0,0,0,.48),
            rgba(0,0,0,.72)
        ),
        url("blue-orbit.jpg");

    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.loginBox{
    width:390px;
    max-width:100%;

    padding:38px 32px;

    text-align:center;

    background:rgba(5,15,25,.86);

    border:1px solid rgba(255,255,255,.08);

    border-radius:24px;

    backdrop-filter:blur(15px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.65);
}

.loginLogo{
    width:175px;
    max-width:75%;

    margin-bottom:20px;

    border-radius:14px;
}

.loginBox h1{
    margin-bottom:22px;
    font-size:28px;
}

.loginBox input{
    margin:7px 0;
}

.loginBtn{
    width:100%;
    margin-top:12px;

    background:linear-gradient(
        135deg,
        #0ea5e9,
        #2563eb
    );

    color:white;
}

.loginBtn:hover{
    background:linear-gradient(
        135deg,
        #0284c7,
        #1d4ed8
    );
}

.error{
    color:#ff7777;
    margin-top:12px;
    min-height:18px;
}


/* =====================================================
   APP HEADER
===================================================== */

#app{
    display:none;
    min-height:100vh;
}

.header{
    min-height:72px;

    padding:12px 28px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        linear-gradient(
            90deg,
            #091b2a,
            #0d2437
        );

    border-bottom:1px solid #263e51;

    position:sticky;
    top:0;
    z-index:50;

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);
}

.headerLogo{
    width:115px;
    height:auto;
    border-radius:10px;
}

.headerRight{
    display:flex;
    align-items:center;
    gap:14px;

    font-weight:bold;
}

#userBranch{
    color:#d8f3ff;
}

.logout{
    background:#ef4444;
    color:white;
}

.logout:hover{
    background:#dc2626;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:100%;
    max-width:1450px;

    margin:auto;

    padding:28px;
}

.title{
    margin-bottom:22px;
    font-size:30px;
}


/* =====================================================
   DATE
===================================================== */

.dateBox{
    background:
        linear-gradient(
            145deg,
            #102b40,
            #0d2233
        );

    border:1px solid #234157;

    padding:20px;

    border-radius:18px;

    margin-bottom:20px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.2);
}

.dateBox label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.dateInput{
    max-width:280px;
}


/* =====================================================
   SALE CARDS
===================================================== */

.cards{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:18px;
}

.card{
    background:
        linear-gradient(
            145deg,
            #102b40,
            #0d2030
        );

    border:1px solid #244359;

    padding:28px;

    border-radius:20px;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 10px 30px rgba(0,0,0,.2);
}

.card:hover{
    transform:translateY(-4px);

    border-color:#38bdf8;

    box-shadow:
        0 15px 40px rgba(14,165,233,.15);
}

.card h2{
    margin-bottom:9px;
    font-size:24px;
}

.card p{
    color:#a8c1d1;
}


/* =====================================================
   FORM
===================================================== */

.formBox{
    margin-top:22px;

    background:
        linear-gradient(
            145deg,
            #102b40,
            #0d2233
        );

    border:1px solid #234157;

    padding:25px;

    border-radius:20px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.2);
}

.formBox h2{
    margin-bottom:18px;
}

.formGrid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:13px;
}

.formGrid input,
.formGrid select{
    margin:0;
}

.priceBox{
    margin-top:16px;

    padding:16px;

    background:#091a29;

    border:1px solid #263e51;

    border-radius:12px;

    font-size:17px;
    font-weight:bold;

    color:#d9f3ff;
}

.saveBtn{
    margin-top:16px;

    background:#22c55e;
    color:white;
}

.saveBtn:hover{
    background:#16a34a;
}

.cancelBtn{
    margin-top:16px;
    margin-left:8px;

    background:#475569;
    color:white;
}


/* =====================================================
   SEARCH
===================================================== */

.searchBox{
    margin-top:25px;

    background:
        linear-gradient(
            145deg,
            #102b40,
            #0d2233
        );

    border:1px solid #234157;

    padding:22px;

    border-radius:20px;
}

.searchBox h2{
    margin-bottom:14px;
}

.searchResults{
    margin-top:15px;
}

.ticket{
    background:#091a29;

    border:1px solid #263e51;

    padding:18px;

    margin-top:10px;

    border-radius:15px;
}

.ticketTop{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;
}

.ticketInfo{
    margin-top:10px;
    line-height:1.8;
}

.ticketActions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.editBtn{
    background:#f59e0b;
    color:#111827;
}

.editBtn:hover{
    background:#d97706;
}

.deleteBtn{
    background:#dc2626;
    color:white;
}

.deleteBtn:hover{
    background:#b91c1c;
}

.badge{
    display:inline-block;

    padding:6px 10px;

    border-radius:20px;

    background:#164e63;

    margin-top:7px;
    margin-right:5px;

    font-size:13px;
}


/* =====================================================
   HOST
===================================================== */

.hostPanel{
    margin-top:32px;
}

.hostTitle{
    margin-bottom:18px;

    font-size:28px;
}

.hostFilters{
    background:
        linear-gradient(
            145deg,
            #102b40,
            #0d2233
        );

    border:1px solid #234157;

    padding:20px;

    border-radius:18px;

    margin-bottom:22px;
}

.hostFilters label{
    display:block;

    margin-bottom:8px;

    font-weight:bold;
}

.hostDate{
    max-width:280px;
}


/* =====================================================
   PRICE LIST
===================================================== */

.priceList{
    margin-bottom:22px;

    background:
        linear-gradient(
            145deg,
            #102b40,
            #0d2233
        );

    border:1px solid #234157;

    padding:20px;

    border-radius:18px;
}

.priceList h3{
    margin-bottom:12px;
}

.priceGrid{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:10px;
}

.priceItem{
    background:#091a29;

    border:1px solid #263e51;

    padding:15px;

    border-radius:12px;

    text-align:center;

    line-height:1.6;
}


/* =====================================================
   BRANCH CARD
===================================================== */

.branchCard{
    background:
        linear-gradient(
            145deg,
            #102b40,
            #0d2233
        );

    border:1px solid #234157;

    padding:22px;

    border-radius:20px;

    margin-bottom:24px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.2);

    overflow:hidden;
}

.branchHeader{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;

    margin-bottom:18px;

    flex-wrap:wrap;
}

.branchHeader h3{
    font-size:24px;
}

.branchCash{
    background:#064e3b;

    border:1px solid #047857;

    padding:8px 13px;

    border-radius:20px;

    color:#bbf7d0;

    font-weight:bold;
}


/* =====================================================
   HOST TABLE SECTION
===================================================== */

.tableTitle{
    margin-top:20px;
    margin-bottom:10px;

    font-size:19px;

    color:#d8f3ff;
}

.tableWrapper{
    width:100%;
    overflow-x:auto;

    -webkit-overflow-scrolling:touch;

    margin-bottom:20px;

    border-radius:12px;
}

.summaryTable{
    width:100%;

    min-width:850px;

    border-collapse:collapse;
}

.summaryTable th,
.summaryTable td{
    border:1px solid #294154;

    padding:12px;

    text-align:center;
}

.summaryTable th{
    background:#091a29;

    color:#cceeff;

    font-weight:bold;
}

.summaryTable td{
    background:#102b40;
}

.summaryTable .totalRow td{
    background:#12354a;

    font-weight:bold;
}

.onlineRow td{
    background:#102b40;
}

.offlineRow td{
    background:#102b40;
}

.cash{
    color:#4ade80;
    font-weight:bold;
}


/* =====================================================
   GRAND TOTAL
===================================================== */

.grandTotal{
    margin-top:28px;

    background:
        linear-gradient(
            145deg,
            #0b1d2c,
            #091a29
        );

    border:1px solid #2a465c;

    padding:25px;

    border-radius:20px;

    overflow:hidden;
}

.grandTotal h2{
    margin-bottom:18px;
}

.grandTable{
    width:100%;

    min-width:850px;

    border-collapse:collapse;
}

.grandTable th,
.grandTable td{
    border:1px solid #294154;

    padding:13px;

    text-align:center;
}

.grandTable th{
    background:#102b40;
}

.grandTable td{
    background:#0d2233;
}

.grandTable .grandRow td{
    background:#164e63;

    font-weight:bold;

    font-size:17px;
}


/* =====================================================
   STATUS
===================================================== */

.status{
    margin-top:15px;

    padding:12px 15px;

    border-radius:10px;

    display:none;

    font-weight:bold;
}

.status.success{
    display:block;

    background:#064e3b;

    border:1px solid #047857;

    color:#bbf7d0;
}

.status.error{
    display:block;

    background:#450a0a;

    border:1px solid #991b1b;

    color:#fecaca;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .container{
        padding:20px;
    }

    .priceGrid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}

@media(max-width:700px){

    .header{
        padding:10px 14px;
    }

    .headerLogo{
        width:90px;
    }

    .headerRight{
        gap:8px;
        font-size:13px;
    }

    .logout{
        padding:9px 12px;
    }

    .container{
        padding:15px;
    }

    .title{
        font-size:25px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .formGrid{
        grid-template-columns:1fr;
    }

    .priceGrid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .branchCard{
        padding:15px;
    }

    .branchHeader h3{
        font-size:21px;
    }

    .loginBox{
        padding:30px 22px;
    }

}

@media(max-width:420px){

    .priceGrid{
        grid-template-columns:1fr;
    }

    .ticketTop{
        align-items:flex-start;
        flex-direction:column;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginPage">

    <div class="loginBox">

        <img
            src="blue-orbit.jpg"
            class="loginLogo"
            alt="Blue Orbit"
        >

        <h1>
            Ticket Management
        </h1>

        <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
        >

        <button
            class="loginBtn"
            onclick="login()"
        >
            LOGIN
        </button>

        <div
            id="loginError"
            class="error"
        ></div>

    </div>

</section>


<!-- =====================================================
     APP
===================================================== -->

<section id="app">


<header class="header">

    <img
        src="blue-orbit.jpg"
        class="headerLogo"
        alt="Blue Orbit"
    >

    <div class="headerRight">

        <span id="userBranch"></span>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<main class="container">

    <h1 class="title">
        Ticket Management
    </h1>


    <!-- =================================================
         BRANCH SALE DATE
    ================================================== -->

    <div
        id="branchDateBox"
        class="dateBox"
    >

        <label>
            Sale Date
        </label>

        <input
            id="saleDate"
            class="dateInput"
            type="date"
        >

    </div>


    <!-- =================================================
         SALE CARDS
    ================================================== -->

    <div
        id="saleCards"
        class="cards"
    >

        <div
            class="card"
            onclick="chooseSale('Online')"
        >

            <h2>
                ONLINE
            </h2>

            <p>
                Online Ticket Sale
            </p>

        </div>


        <div
            class="card"
            onclick="chooseSale('Offline')"
        >

            <h2>
                OFFLINE
            </h2>

            <p>
                Offline Ticket Sale
            </p>

        </div>

    </div>


    <!-- =================================================
         FORM
    ================================================== -->

    <div
        id="formBox"
        class="formBox hidden"
    >

        <h2 id="formTitle">
            Ticket Handover
        </h2>


        <div class="formGrid">

            <input
                id="customerName"
                placeholder="Customer Name"
            >


            <input
                id="serial"
                placeholder="Serial"
            >


            <select id="ticketType">

                <option value="">
                    Ticket Type
                </option>

                <option value="Premium">
                    Premium
                </option>

                <option value="Fanbit">
                    Fanbit
                </option>

                <option value="VIP">
                    VIP
                </option>

                <option value="Regular">
                    Regular
                </option>

            </select>


            <input
                id="gmail"
                type="email"
                placeholder="Gmail"
            >


            <input
                id="phone"
                placeholder="Phone"
            >


            <select id="saleType">

                <option value="">
                    Sale Type
                </option>

                <option value="Online">
                    Online
                </option>

                <option value="Offline">
                    Offline
                </option>

            </select>


            <input
                id="quantity"
                type="number"
                min="1"
                value="1"
                placeholder="Quantity"
                oninput="updatePrice()"
            >

        </div>


        <div
            id="priceBox"
            class="priceBox"
        >
            Online sale — No cash
        </div>


        <button
            class="saveBtn"
            onclick="saveTicket()"
        >
            SAVE
        </button>


        <button
            class="cancelBtn"
            onclick="cancelEdit()"
        >
            CANCEL
        </button>


        <div
            id="saveStatus"
            class="status"
        ></div>

    </div>


    <!-- =================================================
         SEARCH
    ================================================== -->

    <div class="searchBox">

        <h2>
            Search Tickets
        </h2>

        <input
            id="search"
            placeholder="Search by Phone / Customer / Gmail / Serial"
            oninput="searchTickets()"
        >

        <div
            id="searchResults"
            class="searchResults"
        ></div>

    </div>


    <!-- =================================================
         HOST DASHBOARD
    ================================================== -->

    <div
        id="hostPanel"
        class="hostPanel hidden"
    >

        <h2 class="hostTitle">
            HOST DASHBOARD
        </h2>


        <div class="hostFilters">

            <label>
                Report Date
            </label>

            <input
                id="hostDate"
                class="hostDate"
                type="date"
                onchange="loadHostDashboard()"
            >

        </div>


        <!-- =================================================
             PRICE LIST
        ================================================== -->

        <div class="priceList">

            <h3>
                Offline Prices
            </h3>

            <div class="priceGrid">

                <div class="priceItem">

                    <b>
                        Premium
                    </b>

                    <br>

                    1,500 EGP

                </div>


                <div class="priceItem">

                    <b>
                        Fanbit
                    </b>

                    <br>

                    1,200 EGP

                </div>


                <div class="priceItem">

                    <b>
                        VIP
                    </b>

                    <br>

                    800 EGP

                </div>


                <div class="priceItem">

                    <b>
                        Regular
                    </b>

                    <br>

                    500 EGP

                </div>

            </div>

        </div>


        <div
            id="hostResults"
        ></div>


        <div
            id="grandTotal"
            class="grandTotal"
        ></div>

    </div>

</main>

</section>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://fpfsgxrsppwpesritsva.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_dHEyax8rhZKR4A1Ie8BmKw_ttSL2dZ3";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   GLOBALS
===================================================== */

let currentUser = null;

let currentBranch = null;

let editingId = null;


/* =====================================================
   PRICES
===================================================== */

const PRICES = {

    Premium:1500,

    Fanbit:1200,

    VIP:800,

    Regular:500

};


/* =====================================================
   TODAY
===================================================== */

function today(){

    const d =
        new Date();

    const year =
        d.getFullYear();

    const month =
        String(
            d.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            d.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


/* =====================================================
   INITIAL DATE
===================================================== */

document
    .getElementById("saleDate")
    .value = today();

document
    .getElementById("hostDate")
    .value = today();


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const error =
        document
        .getElementById("loginError");


    error.textContent = "";


    if(!email || !password){

        error.textContent =
            "Enter email and password.";

        return;

    }


    const {data,error:loginError} =
        await supabaseClient
        .auth
        .signInWithPassword({

            email:email,

            password:password

        });


    if(loginError){

        error.textContent =
            loginError.message;

        return;

    }


    currentUser =
        data.user;


    await loadUser();

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser(){

    const {data,error} =
        await supabaseClient
        .from("branch_users")
        .select("name,branch")
        .eq(
            "user_id",
            currentUser.id
        )
        .single();


    if(error){

        alert(
            "User branch was not found."
        );

        await logout();

        return;

    }


    currentBranch =
        data.branch;


    document
        .getElementById("userBranch")
        .textContent =
        `${data.name} — ${data.branch}`;


    document
        .getElementById("loginPage")
        .style
        .display =
        "none";


    document
        .getElementById("app")
        .style
        .display =
        "block";


    /*
       HOST MODE
    */

    if(currentBranch === "ALL"){

        /*
           HOST CANNOT SELL
        */

        document
            .getElementById("saleCards")
            .classList
            .add("hidden");


        document
            .getElementById("branchDateBox")
            .classList
            .add("hidden");


        document
            .getElementById("formBox")
            .classList
            .add("hidden");


        /*
           HOST DASHBOARD
        */

        document
            .getElementById("hostPanel")
            .classList
            .remove("hidden");


        await loadHostDashboard();

    }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient
        .auth
        .signOut();


    currentUser = null;

    currentBranch = null;

    editingId = null;


    document
        .getElementById("app")
        .style
        .display =
        "none";


    document
        .getElementById("loginPage")
        .style
        .display =
        "flex";


    document
        .getElementById("loginError")
        .textContent = "";

}


/* =====================================================
   CHOOSE SALE
===================================================== */

function chooseSale(type){

    /*
       HOST BLOCK
    */

    if(currentBranch === "ALL"){

        alert(
            "HOST cannot create tickets."
        );

        return;

    }


    editingId = null;


    document
        .getElementById("formBox")
        .classList
        .remove("hidden");


    document
        .getElementById("formTitle")

/* =====================================================

===================================================== */

function updatePrice(){

    const saleType =
        document
        .getElementById("saleType")
        .value;


    const category =
        document
        .getElementById("ticketType")
        .value;


    const quantity =
        Number(
            document
            .getElementById("quantity")
            .value
        ) || 1;


    const priceBox =
        document
        .getElementById("priceBox");


    if(saleType !== "Offline"){

        priceBox.textContent =
            "Online sale — No cash";

        return;

    }


    if(!category){

        priceBox.textContent =
            "Choose ticket category";

        return;

    }


    const price =
        PRICES[category] || 0;


    const total =
        price * quantity;


    priceBox.innerHTML =
        `Price: ${price.toLocaleString()} EGP
         × ${quantity}
         = <b>${total.toLocaleString()} EGP</b>`;

}

/* =====================================================
   SAVE TICKET
===================================================== */

async function saveTicket(){

    /*
       HOST BLOCK
    */

    if(currentBranch === "ALL"){

        showStatus(
            "saveStatus",
            "Save unsuccessful: HOST cannot save tickets.",
            false
        );

        return;

    }


    const customerName =
        document
        .getElementById("customerName")
        .value
        .trim();


    const serial =
        document
        .getElementById("serial")
        .value
        .trim();


    const category =
        document
        .getElementById("ticketType")
        .value;


    const gmail =
        document
        .getElementById("gmail")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const saleType =
        document
        .getElementById("saleType")
        .value;


    const quantity =
        Number(
            document
            .getElementById("quantity")
            .value
        );


    const saleDate =
        document
        .getElementById("saleDate")
        .value;


    if(
        !customerName ||
        !serial ||
        !category ||
        !gmail ||
        !phone ||
        !saleType ||
        !quantity ||
        quantity < 1 ||
        !saleDate
    ){

        showStatus(
            "saveStatus",
            "Save unsuccessful: Please fill all required fields.",
            false
        );

        return;

    }


    const unitPrice =
        saleType === "Offline"
        ? Number(PRICES[category] || 0)
        : 0;


    const amount =
        saleType === "Offline"
        ? unitPrice * quantity
        : 0;


    /*
       IMPORTANT:
       Branch is always the logged-in branch.
       HOST cannot create tickets.
    */

    const ticketData = {

        branch:
            currentBranch,

        sale_type:
            saleType,

        quantity:
            quantity,

        customer_name:
            customerName,

        serial:
            serial,

        ticket_type:
            category,

        category:
            category,

        gmail:
            gmail,

        phone:
            phone,

        sale_date:
            saleDate,

        price:
            unitPrice,

        amount:
            amount,

        created_by:
            currentUser.id,

        updated_at:
            new Date().toISOString()

    };


    let result;


    /* =================================================
       EDIT
    ================================================= */

    if(editingId){

        /*
           Only edit ticket belonging to this branch.
        */

        result =
            await supabaseClient
            .from("tickets")
            .update(ticketData)
            .eq(
                "id",
                editingId
            )
            .eq(
                "branch",
                currentBranch
            );

    }


    /* =================================================
       NEW
    ================================================= */

    else{

        result =
            await supabaseClient
            .from("tickets")
            .insert([
                ticketData
            ]);

    }


    if(result.error){

        showStatus(
            "saveStatus",
            "Save unsuccessful: " +
            result.error.message,
            false
        );

        return;

    }


    showStatus(
        "saveStatus",
        editingId
        ? "Save successful — Ticket updated."
        : "Save successful — Ticket created.",
        true
    );


    clearForm();


    document
        .getElementById("formBox")
        .classList
        .add("hidden");


    await searchTickets();


    /*
       HOST automatically refreshes
       if needed.
    */

    if(currentBranch === "ALL"){

        await loadHostDashboard();

    }

}

}

===================================================== */

async function deleteTicket(ticketId){

       HOST CANNOT DELETE
    */

    if(currentBranch === "ALL"){

        );

    }


    if(!ticketId){

        );

    const confirmDelete =
        confirm(
            "Are you sure you want to permanently delete this ticket?\n\n" +
            "It will be removed from the Branch, HOST Dashboard, Search and all totals."
        );


    if(!confirmDelete){

        return;

    /*

    */

    const {error} =
        await supabaseClient
        .from("tickets")
        .delete()
        .eq(
            "id",
            ticketId
        )
        .eq(
            "branch",
            currentBranch
        );


    if(error){

    alert(

    );


    editingId = null;


    document
        .getElementById("formBox")
        .classList
        .add("hidden");


    clearForm();


    await searchTickets();


    /*
       Refresh HOST if needed
    */

    if(currentBranch === "ALL"){

        await loadHostDashboard();

    }

/* =====================================================
   SEARCH TICKETS
===================================================== */

async function searchTickets(){

    const search =
        document
        .getElementById("search")
        .value
        .trim();


    /*
       If empty
    */

    if(!search){

        document
            .getElementById("searchResults")
            .innerHTML = "";

        return;

    }


    let query =
        supabaseClient
        .from("tickets")
        .select("*");


    /*
       Branch user sees only
       their branch in search.
    */

    if(currentBranch &&
       currentBranch !== "ALL"){

        query =
            query.eq(
                "branch",
                currentBranch
            );

    }


    /*
       Search
    */

    const safeSearch =
        search
        .replaceAll(",","");


    query =
        query.or(

            `phone.ilike.%${safeSearch}%,` +
            `customer_name.ilike.%${safeSearch}%,` +
            `gmail.ilike.%${safeSearch}%,` +
            `serial.ilike.%${safeSearch}%`

        );


    query =
        query.order(
            "created_at",
            {
                ascending:false
            }
        );


    const {data,error} =
        await query;


    if(error){

        document
            .getElementById("searchResults")
            .innerHTML =
            `<p>
                ${escapeHTML(error.message)}
            </p>`;

        return;

    }


    renderTickets(
        data || []
    );

}

/* =====================================================
   HOST DASHBOARD CALCULATIONS
===================================================== */

function createEmptySummary(){

    return {

        Premium:0,

        Fanbit:0,

        VIP:0,

        Regular:0,

        total:0,

        cash:0

    };

}


function buildHostDashboard(
    tickets
){

    /*
       IMPORTANT:
       Branches are created ONLY
       when there is actual data.
    */

    const branches = {};


    const categories = [
        "Premium",
        "Fanbit",
        "VIP",
        "Regular"
    ];


    tickets.forEach(ticket => {

        const branch =
            ticket.branch ||
            "Unknown";


        if(!branches[branch]){

            branches[branch] = {

                Online:
                    createEmptySummary(),

                Offline:
                    createEmptySummary()

            };

        }


        const category =
            ticket.category ||
            ticket.ticket_type;


        const quantity =
            Number(
                ticket.quantity || 0
            );


        if(
            !categories.includes(
                category
            )
        ){

            return;

        }


        if(
            ticket.sale_type === "Online"
        ){

            branches[branch]
                .Online[category]
                += quantity;


            branches[branch]
                .Online.total
                += quantity;

        }


        if(
            ticket.sale_type === "Offline"
        ){

            branches[branch]
                .Offline[category]
                += quantity;


            branches[branch]
                .Offline.total
                += quantity;


            /*
               Use stored amount.
               This makes totals reliable.
            */

            branches[branch]
                .Offline.cash
                += Number(
                    ticket.amount || 0
                );

        }

    });


    renderBranchTables(
        branches
    );


    renderGrandTotal(
        branches
    );

}

/* =====================================================

    const totals = {

        Online:
            createEmptySummary(),

        Offline:

    };


    Object.values(branches)
    .forEach(branch => {

        const online =
            branch.Online;

        const offline =
            branch.Offline;


        totals.Online.Premium
            += online.Premium;

        totals.Online.Fanbit
            += online.Fanbit;

        totals.Online.VIP
            += online.VIP;

        totals.Online.Regular

        totals.Online.total

        totals.Offline.Premium

        totals.Offline.Fanbit

        totals.Offline.VIP

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}
