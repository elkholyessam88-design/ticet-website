<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Ticket Branches</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#17181c;
  color:white;
}

body{
  min-height:100vh;
}

.hidden{
  display:none!important;
}

button{
  border:none;
  border-radius:10px;
  padding:13px 20px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
}

button:disabled{
  opacity:.6;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #555;
  background:#303136;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#8b5cf6;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:7px;
  color:#ddd;
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(
      circle at top,
      #30245b,
      #17181c 50%
    );
}

.login-box{
  width:100%;
  max-width:420px;
  padding:35px;
  background:#202126;
  border:1px solid #444;
  border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.login-box h1{
  text-align:center;
  margin-top:0;
}

.login-box h1 span{
  color:#8b5cf6;
}

.login-subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}

#loginBtn{
  width:100%;
  margin-top:20px;
  background:#8b5cf6;
  color:white;
}

#loginError{
  min-height:20px;
  text-align:center;
  color:#ff6b6b;
}

/* HEADER */

header{
  padding:18px 25px;
  background:#202126;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  border-bottom:1px solid #444;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0;
  font-size:27px;
}

header h1 span{
  color:#8b5cf6;
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px;
}

#userName{
  color:#ddd;
  font-size:14px;
}

#userRole{
  color:#9b7cff;
  font-weight:bold;
  font-size:13px;
}

.logout{
  background:#55565d;
  color:white;
}

/* CONTAINER */

.container{
  max-width:1100px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#202126;
  border:1px solid #444;
  border-radius:18px;
  padding:25px;
  margin-bottom:25px;
}

.branch{
  border:1px solid #444;
  border-radius:15px;
  padding:20px;
  margin-top:20px;
  background:#1c1d21;
}

.branch h3{
  color:#9b7cff;
  margin-top:0;
}

.row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.green{
  background:#008f68;
  color:white;
  margin-top:20px;
}

.purple{
  background:#8b5cf6;
  color:white;
  margin-top:20px;
}

.result-box{
  background:#1c1d21;
  border:1px solid #444;
  border-radius:14px;
  padding:18px;
  margin-top:15px;
  line-height:1.8;
}

/* HOST */

.host-dashboard{
  border-color:#8b5cf6;
}

.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#4ade80;
  font-size:13px;
  font-weight:bold;
  margin-bottom:15px;
}

.live-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#4ade80;
  box-shadow:0 0 10px #4ade80;
}

/* HOST SUMMARY */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:20px;
}

.summary-card{
  background:#292a30;
  border:1px solid #444;
  border-radius:15px;
  padding:20px;
}

.summary-card h3{
  margin-top:0;
  color:#aaa;
}

.summary-number{
  font-size:32px;
  font-weight:bold;
  margin-top:10px;
}

.online-number{
  color:#4ade80;
}

.offline-number{
  color:#fbbf24;
}

.money-number{
  color:#60a5fa;
}

.total-number{
  color:#c084fc;
}

/* BRANCH HOST */

.host-branch{
  margin-top:20px;
  background:#1c1d21;
  border:1px solid #444;
  border-radius:16px;
  padding:20px;
}

.host-branch-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.host-branch-title h3{
  color:#c084fc;
  margin:0;
  font-size:21px;
}

.branch-total{
  background:#8b5cf6;
  padding:7px 12px;
  border-radius:8px;
  font-weight:bold;
}

.stats-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:#292a30;
  border-radius:12px;
  padding:15px;
}

.stat-title{
  color:#aaa;
  font-size:13px;
}

.stat-value{
  font-size:25px;
  font-weight:bold;
  margin-top:5px;
}

.offline-details{
  margin-top:18px;
  border-top:1px solid #444;
  padding-top:15px;
}

.offline-details h4{
  margin:0 0 10px;
  color:#fbbf24;
}

.offline-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#292a30;
  padding:12px;
  border-radius:9px;
  margin-top:8px;
}

.offline-item-left{
  display:flex;
  flex-direction:column;
}

.offline-type{
  font-weight:bold;
}

.offline-branch{
  color:#aaa;
  font-size:12px;
}

.offline-count{
  color:#fbbf24;
  font-weight:bold;
}

/* GRAND TOTAL */

.grand-total{
  margin-top:25px;
  padding:25px;
  border-radius:18px;
  border:1px solid #8b5cf6;
  background:
    linear-gradient(
      135deg,
      #27203d,
      #202126
    );
}

.grand-total h2{
  margin-top:0;
  color:#c084fc;
}

.grand-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.grand-item{
  background:#292a30;
  border-radius:12px;
  padding:18px;
}

.grand-label{
  color:#aaa;
}

.grand-value{
  font-size:28px;
  font-weight:bold;
  margin-top:5px;
}

/* MOBILE */

@media(max-width:1100px){

  .container{
    max-width:95%;
  }

  .row{
    grid-template-columns:repeat(2,1fr);
  }

  .summary-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .grand-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:700px){

  header{
    position:relative;
    flex-direction:column;
    text-align:center;
  }

  .user-area{
    justify-content:center;
    flex-wrap:wrap;
  }

  .container{
    margin:15px auto;
    padding:12px;
  }

  .card{
    padding:18px;
  }

  .row{
    grid-template-columns:1fr;
  }

  .summary-grid{
    grid-template-columns:1fr;
  }

  .grand-grid{
    grid-template-columns:1fr;
  }

  .stats-row{
    grid-template-columns:1fr;
  }

  .host-branch-title{
    flex-direction:column;
    align-items:flex-start;
  }

  header h1{
    font-size:23px;
  }

}

</style>

</head>


<body>


<!-- LOGIN -->

<div id="loginScreen">

  <div class="login-box">

    <h1>
      Ticket <span>Branches</span>
    </h1>

    <div class="login-subtitle">
      Branch Management System
    </div>

    <label>Email</label>

    <input
      id="loginEmail"
      type="email"
      placeholder="Enter your email"
      autocomplete="username"
    >

    <label>Password</label>

    <input
      id="loginPassword"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <button id="loginBtn">
      Login
    </button>

    <p id="loginError"></p>

  </div>

</div>


<!-- WEBSITE -->

<div id="website" class="hidden">


<header>

  <h1>
    Ticket <span>Branches</span>
  </h1>

  <div class="user-area">

    <div>

      <div id="userName"></div>

      <div id="userRole"></div>

    </div>

    <button
      id="logoutBtn"
      class="logout"
    >
      Logout
    </button>

  </div>

</header>


<div class="container">


<!-- =================================================
     BRANCH USER SALES
================================================= -->

<div
  class="card"
  id="branchSalesCard"
>

  <h2>Enter Ticket Sales</h2>

  <label>Date</label>

  <input
    type="date"
    id="date"
  >

  <label>Branch</label>

  <select id="branch">

    <option value="Zayed">
      Zayed
    </option>

    <option value="Zamalek">
      Zamalek
    </option>

    <option value="Heliopolis">
      Heliopolis
    </option>

    <option value="CFC">
      CFC
    </option>

  </select>


  <div class="branch">

    <h3>Online Tickets</h3>

    <div class="row">

      <div>
        <label>Premium Orbit</label>
        <input
          type="number"
          id="onlinePremium"
          value="0"
          min="0"
        >
      </div>

      <div>
        <label>Fanpit</label>
        <input
          type="number"
          id="onlineFanpit"
          value="0"
          min="0"
        >
      </div>

      <div>
        <label>VIP</label>
        <input
          type="number"
          id="onlineVIP"
          value="0"
          min="0"
        >
      </div>

      <div>
        <label>High Regular</label>
        <input
          type="number"
          id="onlineHigh"
          value="0"
          min="0"
        >
      </div>

    </div>

  </div>


  <div class="branch">

    <h3>Offline Tickets</h3>

    <div class="row">

      <div>
        <label>Premium Orbit</label>
        <input
          type="number"
          id="offlinePremium"
          value="0"
          min="0"
        >
      </div>

      <div>
        <label>Fanpit</label>
        <input
          type="number"
          id="offlineFanpit"
          value="0"
          min="0"
        >
      </div>

      <div>
        <label>VIP</label>
        <input
          type="number"
          id="offlineVIP"
          value="0"
          min="0"
        >
      </div>

      <div>
        <label>High Regular</label>
        <input
          type="number"
          id="offlineHigh"
          value="0"
          min="0"
        >
      </div>

    </div>

    <label>
      Offline Cash (EGP)
    </label>

    <input
      type="number"
      id="offlineCash"
      value="0"
      readonly
    >

  </div>


  <button
    class="green"
    id="saveDataBtn"
  >
    Save Data
  </button>

  <p id="saveMessage"></p>

</div>


<!-- =================================================
     SEARCH FOR BRANCH
================================================= -->

<div
  class="card"
  id="searchCard"
>

  <h2>Search Day</h2>

  <label>Select Date</label>

  <input
    type="date"
    id="searchDate"
  >

  <button
    class="green"
    id="searchBtn"
  >
    Show Day
  </button>

  <div id="results"></div>

</div>


<!-- =================================================
     BRANCH TICKET HANDOVER
================================================= -->

<div
  class="card"
  id="ticketHandoverCard"
>

  <h2>🎟️ Ticket Handover</h2>

  <p style="color:#aaa;">
    Enter customer ticket information.
  </p>

  <label>Date</label>

  <input
    type="date"
    id="ticketDate"
  >

  <label>Customer Name</label>

  <input
    type="text"
    id="customerName"
    placeholder="Customer name"
  >

  <label>Serial</label>

  <input
    type="text"
    id="ticketSerial"
    placeholder="Ticket serial"
  >

  <label>Ticket Type</label>

  <select id="ticketType">

    <option>
      Premium Orbit
    </option>

    <option>
      Fanpit
    </option>

    <option>
      VIP
    </option>

    <option>
      High Regular
    </option>

  </select>

  <label>Gmail</label>

  <input
    type="email"
    id="customerGmail"
    placeholder="customer@gmail.com"
  >

  <label>Phone</label>

  <input
    type="tel"
    id="customerPhone"
    placeholder="Phone number"
  >

  <label>Sale Type</label>

  <select id="saleType">

    <option value="Online">
      Online
    </option>

    <option value="Offline">
      Offline
    </option>

  </select>

  <button
    class="purple"
    id="saveTicketBtn"
  >
    Save Ticket
  </button>

  <p
    id="ticketMessage"
    style="color:#4ade80;"
  ></p>

</div>


<!-- =================================================
     HOST ONLY
================================================= -->

<div
  class="card host-dashboard hidden"
  id="hostDashboard"
>

  <h2>👑 Host Dashboard</h2>

  <div class="live">

    <span class="live-dot"></span>

    LIVE — Branch sales update automatically

  </div>


  <label>Select Date</label>

  <input
    type="date"
    id="hostDate"
  >


  <div
    id="hostDashboardResults"
  >

    <p style="color:#aaa;">
      Loading...
    </p>

  </div>

</div>


</div>

</div>


<script>

/* =================================================
   SUPABASE
================================================= */

const SUPABASE_URL =
"https://ubaooclkpgminlbifpjf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iNL7NMiqyDKAUCmUYNKqpQ_rpOi12EB";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =================================================
   STATE
================================================= */

let currentUser = null;
let currentBranch = "";
let isHost = false;


/* =================================================
   HELPERS
================================================= */

function today(){

  const d = new Date();

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth()+1).padStart(2,"0") +
    "-" +
    String(d.getDate()).padStart(2,"0")
  );

}


/* =================================================
   ELEMENTS
================================================= */

const loginScreen =
document.getElementById("loginScreen");

const website =
document.getElementById("website");

const loginBtn =
document.getElementById("loginBtn");

const loginError =
document.getElementById("loginError");


/* =================================================
   USER PROFILE
================================================= */

async function loadUserProfile(user){

  const {data,error} =
    await supabaseClient
      .from("branch_users")
      .select("branch")
      .eq("user_id",user.id)
      .maybeSingle();

  if(error)
    throw error;

  if(!data)
    throw new Error(
      "User is not assigned to a branch."
    );

  currentUser = user;
  currentBranch = data.branch;

  isHost =
    String(data.branch)
      .toUpperCase() === "ALL";


  document.getElementById(
    "userName"
  ).textContent =
    user.email;


  document.getElementById(
    "userRole"
  ).textContent =
    isHost
      ? "HOST — ALL BRANCHES"
      : currentBranch;


  /*
    HOST:
    show ONLY dashboard
  */

  if(isHost){

    document.body.classList.add(
      "host-user"
    );

    document.getElementById(
      "branchSalesCard"
    ).classList.add("hidden");

    document.getElementById(
      "searchCard"
    ).classList.add("hidden");

    document.getElementById(
      "ticketHandoverCard"
    ).classList.add("hidden");

    document.getElementById(
      "hostDashboard"
    ).classList.remove("hidden");

  }

  else{

    document.body.classList.remove(
      "host-user"
    );

    document.getElementById(
      "branchSalesCard"
    ).classList.remove("hidden");

    document.getElementById(
      "searchCard"
    ).classList.remove("hidden");

    document.getElementById(
      "ticketHandoverCard"
    ).classList.remove("hidden");

    document.getElementById(
      "hostDashboard"
    ).classList.add("hidden");


    document.getElementById(
      "branch"
    ).value =
      currentBranch;

    document.getElementById(
      "branch"
    ).disabled = true;

  }

}


/* =================================================
   OPEN WEBSITE
================================================= */

async function openWebsite(user){

  await loadUserProfile(user);

  loginScreen.style.display =
    "none";

  website.classList.remove(
    "hidden"
  );

  document.getElementById(
    "date"
  ).value = today();

  document.getElementById(
    "searchDate"
  ).value = today();

  document.getElementById(
    "ticketDate"
  ).value = today();

  document.getElementById(
    "hostDate"
  ).value = today();


  calculateOfflineCash();


  if(isHost){

    await loadHostDashboard();

  }

}


/* =================================================
   LOGIN
================================================= */

async function login(){

  loginError.textContent = "";

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  if(!email || !password){

    loginError.textContent =
      "Enter email and password.";

    return;

  }


  loginBtn.disabled = true;

  loginBtn.textContent =
    "Logging in...";


  try{

    const {data,error} =
      await supabaseClient.auth
        .signInWithPassword({
          email,
          password
        });


    if(error)
      throw error;


    await openWebsite(
      data.user
    );

  }

  catch(error){

    console.error(error);

    loginError.textContent =
      "Invalid login credentials.";

  }

  finally{

    loginBtn.disabled = false;

    loginBtn.textContent =
      "Login";

  }

}


loginBtn.addEventListener(
  "click",
  login
);


document.getElementById(
  "loginPassword"
).addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter")
      login();

  }
);


/* =================================================
   SESSION
================================================= */

async function checkSession(){

  const {data,error} =
    await supabaseClient.auth
      .getSession();

  if(error){

    console.error(error);
    return;

  }

  if(
    data?.session?.user
  ){

    try{

      await openWebsite(
        data.session.user
      );

    }

    catch(error){

      console.error(error);

      await supabaseClient.auth
        .signOut();

    }

  }

}


supabaseClient.auth
.onAuthStateChange(
  async(event,session)=>{

    if(
      event === "SIGNED_IN" &&
      session?.user
    ){

      try{

        await openWebsite(
          session.user
        );

      }

      catch(error){

        console.error(error);

      }

    }

    if(
      event === "SIGNED_OUT"
    ){

      location.reload();

    }

  }
);


/* =================================================
   LOGOUT
================================================= */

document.getElementById(
  "logoutBtn"
).addEventListener(
  "click",
  async()=>{

    await supabaseClient.auth
      .signOut();

  }
);


/* =================================================
   PRICES
================================================= */

const PRICES = {

  "Premium Orbit":1500,
  "Fanpit":1200,
  "VIP":800,
  "High Regular":500

};


/* =================================================
   OFFLINE CASH
================================================= */

function calculateOfflineCash(){

  const premium =
    Number(
      document.getElementById(
        "offlinePremium"
      )?.value || 0
    );

  const fanpit =
    Number(
      document.getElementById(
        "offlineFanpit"
      )?.value || 0
    );

  const vip =
    Number(
      document.getElementById(
        "offlineVIP"
      )?.value || 0
    );

  const high =
    Number(
      document.getElementById(
        "offlineHigh"
      )?.value || 0
    );


  const total =
    premium * 1500 +
    fanpit * 1200 +
    vip * 800 +
    high * 500;


  const input =
    document.getElementById(
      "offlineCash"
    );

  if(input)
    input.value = total;


  return total;

}


[
  "offlinePremium",
  "offlineFanpit",
  "offlineVIP",
  "offlineHigh"
].forEach(id=>{

  document.getElementById(id)
    ?.addEventListener(
      "input",
      calculateOfflineCash
    );

});


/* =================================================
   SAVE SALES
================================================= */

async function saveData(){

  if(isHost)
    return;


  const date =
    document.getElementById(
      "date"
    ).value;

  const branch =
    currentBranch;


  const data = {

    sale_date:date,
    branch:branch,

    online_premium:
      Number(
        document.getElementById(
          "onlinePremium"
        ).value || 0
      ),

    online_fanpit:
      Number(
        document.getElementById(
          "onlineFanpit"
        ).value || 0
      ),

    online_vip:
      Number(
        document.getElementById(
          "onlineVIP"
        ).value || 0
      ),

    online_high_regular:
      Number(
        document.getElementById(
          "onlineHigh"
        ).value || 0
      ),

    offline_premium:
      Number(
        document.getElementById(
          "offlinePremium"
        ).value || 0
      ),

    offline_fanpit:
      Number(
        document.getElementById(
          "offlineFanpit"
        ).value || 0
      ),

    offline_vip:
      Number(
        document.getElementById(
          "offlineVIP"
        ).value || 0
      ),

    offline_high_regular:
      Number(
        document.getElementById(
          "offlineHigh"
        ).value || 0
      ),

    offline_cash:
      calculateOfflineCash()

  };


  const button =
    document.getElementById(
      "saveDataBtn"
    );

  const message =
    document.getElementById(
      "saveMessage"
    );


  button.disabled = true;

  button.textContent =
    "Saving...";


  try{

    const {data:existing,error:findError} =
      await supabaseClient
        .from("ticket_sales")
        .select("id")
        .eq("sale_date",date)
        .eq("branch",branch)
        .maybeSingle();


    if(findError)
      throw findError;


    let result;


    if(existing){

      result =
        await supabaseClient
          .from("ticket_sales")
          .update(data)
          .eq("id",existing.id);

    }

    else{

      result =
        await supabaseClient
          .from("ticket_sales")
          .insert([data]);

    }


    if(result.error)
      throw result.error;


    message.style.color =
      "#4ade80";

    message.textContent =
      "✓ Data saved successfully";


    if(isHost)
      await loadHostDashboard();

  }

  catch(error){

    console.error(error);

    message.style.color =
      "#ff6b6b";

    message.textContent =
      "❌ " + error.message;

  }

  finally{

    button.disabled = false;

    button.textContent =
      "Save Data";

  }

}


document.getElementById(
  "saveDataBtn"
).addEventListener(
  "click",
  saveData
);


/* =================================================

================================================= */

async function searchDay(){

  const date =
    document.getElementById(
      "searchDate"
    ).value;

  const results =
    document.getElementById(
      "results"
    );


  results.innerHTML =
    "<p>Loading...</p>";


  try{

    let query =
      supabaseClient
        .from("ticket_sales")
        .select("*")
        .eq("sale_date",date);


    if(!isHost){

      query =
        query.eq(
          "branch",
          currentBranch
        );

    }


    const {data,error} =
      await query;


    if(error)
      throw error;


    if(!data?.length){

      results.innerHTML =
        "<p>No data found.</p>";

      return;

    }


    results.innerHTML =
      data.map(item=>{

        const online =
          Number(item.online_premium||0)+
          Number(item.online_fanpit||0)+
          Number(item.online_vip||0)+
          Number(item.online_high_regular||0);

        const offline =
          Number(item.offline_premium||0)+
          Number(item.offline_fanpit||0)+
          Number(item.offline_vip||0)+
          Number(item.offline_high_regular||0);


        return `

          <div class="result-box">

            <h3>${item.branch}</h3>

            <b>Online Tickets:</b>
            ${online}

            <br><br>

            <b>Offline Tickets:</b>
            ${offline}

            <br>

            Premium Orbit:
            ${item.offline_premium||0}

            <br>

            Fanpit:
            ${item.offline_fanpit||0}

            <br>

            VIP:
            ${item.offline_vip||0}

            <br>

            High Regular:
            ${item.offline_high_regular||0}

            <br><br>

            <b>Offline Cash:</b>
            ${Number(
              item.offline_cash||0
            ).toLocaleString()}

          </div>

        `;

      }).join("");

  }

  catch(error){

    results.innerHTML =
      `<p style="color:#ff6b6b;">
        ❌ ${error.message}
      </p>`;

  }

}

/* =================================================
   SAVE TICKET
================================================= */

async function saveTicket(){

  if(isHost)
    return;


  const date =
    document.getElementById(
      "ticketDate"
    ).value;

  const name =
    document.getElementById(
      "customerName"
    ).value.trim();

  const serial =
    document.getElementById(
      "ticketSerial"
    ).value.trim();

  const type =
    document.getElementById(
      "ticketType"
    ).value;

  const gmail =
    document.getElementById(
      "customerGmail"
    ).value.trim();

  const phone =
    document.getElementById(
      "customerPhone"
    ).value.trim();

  const saleType =
    document.getElementById(
      "saleType"
    ).value;


  const message =
    document.getElementById(
      "ticketMessage"
    );


  if(
    !date ||
    !name ||
    !serial ||
    !gmail ||
    !phone
  ){

    message.style.color =
      "#ff6b6b";

    message.textContent =
      "Please fill all fields.";

    return;

  }


  const button =
    document.getElementById(
      "saveTicketBtn"
    );


  button.disabled = true;

  button.textContent =
    "Saving...";


  try{

    const ticket = {

      sale_date:date,

      branch:currentBranch,

      customer_name:name,

      serial:serial,

      ticket_type:type,

      gmail:gmail,

      phone:phone,

      sale_type:saleType

    };


    const {error} =
      await supabaseClient
        .from("ticket_handover")
        .insert([ticket]);


    if(error)
      throw error;


    message.style.color =
      "#4ade80";

    message.textContent =
      "✓ Ticket saved successfully";


    document.getElementById(
      "customerName"
    ).value = "";

    document.getElementById(
      "ticketSerial"
    ).value = "";

    document.getElementById(
      "customerGmail"
    ).value = "";

    document.getElementById(
      "customerPhone"
    ).value = "";


    playSuccessSound();

  }

  catch(error){

    console.error(error);

    message.style.color =
      "#ff6b6b";

    message.textContent =
      "❌ " + error.message;

  }

  finally{

    button.disabled = false;

    button.textContent =
      "Save Ticket";

  }

}


document.getElementById(
  "saveTicketBtn"
).addEventListener(
  "click",
  saveTicket
);


/* =================================================

async function loadHostDashboard(){

            </h4>


            <div class="offline-item">

              <div class="offline-item-left">

                <span class="offline-type">
                  Premium Orbit
                </span>

                <span class="offline-branch">
                  ${branchName}
                </span>

              </div>

              <span class="offline-count">
                ${
                  item
                    ? item.offline_premium || 0
                    : 0
                }
              </span>

            </div>


            <div class="offline-item">

              <div class="offline-item-left">

                <span class="offline-type">
                  Fanpit
                </span>

                <span class="offline-branch">
                  ${branchName}
                </span>

              </div>

              <span class="offline-count">
                ${
                  item
                    ? item.offline_fanpit || 0
                    : 0
                }
              </span>

            </div>


            <div class="offline-item">

              <div class="offline-item-left">

                <span class="offline-type">
                  VIP
                </span>

                <span class="offline-branch">
                  ${branchName}
                </span>

              </div>

              <span class="offline-count">
                ${
                  item
                    ? item.offline_vip || 0
                    : 0
                }
              </span>

            </div>


            <div class="offline-item">

              <div class="offline-item-left">

                <span class="offline-type">
                  High Regular
                </span>

                <span class="offline-branch">
                  ${branchName}
                </span>

              </div>

                ${
                  item
                    ? item.offline_high_regular || 0
                    : 0
                }
              </span>

            </div>

          </div>

    });


    container.innerHTML = `

        <div class="summary-card">

          <h3>
            Total Online
          </h3>

          <div class="summary-number online-number">
            ${grandOnline}
          </div>

        </div>


        <div class="summary-card">

          <h3>
            Total Offline
          </h3>

          <div class="summary-number offline-number">
            ${grandOffline}
          </div>

        </div>


        <div class="summary-card">

          <h3>
            Total Tickets

          <div class="summary-number total-number">
            ${
              grandOnline +
              grandOffline

          </div>

        </div>


        <div class="summary-card">

          <h3>
            Offline Cash
          </h3>

          <div class="summary-number money-number">

      <div class="grand-total">

   REALTIME SALES
================================================= */

supabaseClient
.channel("ticket-sales-live")
.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"ticket_sales"
  },
  payload=>{

    if(isHost){

      const selected =
        document.getElementById(
          "hostDate"
        ).value;

      const changedDate =
        payload.new?.sale_date ||
        payload.old?.sale_date;


      if(
        selected === changedDate
      ){

        loadHostDashboard();

        playSuccessSound();

      }

    }

  }
)
.subscribe();

/* =================================================
   SOUND
================================================= */

function playSuccessSound(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext)
      return;

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.type =
      "sine";

    oscillator.frequency.value =
      700;

    gain.gain.setValueAtTime(
      .001,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .15,
      audio.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime + .3
    );

    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );

    oscillator.start();

    oscillator.stop(
      audio.currentTime + .3
    );

  }

  catch(error){

    console.log(
      "Audio unavailable"
    );

  }

}
