<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ticket Branches</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#0d0f14;color:#fff}
.hidden{display:none!important}

button{
 border:0;border-radius:10px;padding:13px 20px;
 cursor:pointer;font-weight:bold;font-size:15px
}
button:disabled{opacity:.6;cursor:not-allowed}

input,select{
 width:100%;padding:13px;border-radius:10px;
 border:1px solid #3d414c;background:#20232b;
 color:#fff;font-size:16px;outline:none
}

label{
 display:block;margin:14px 0 7px;color:#ddd
}

#loginScreen{
 min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;
 background:radial-gradient(circle at top,#392260,#0d0f14 60%)
}

.login-box{
 width:100%;max-width:430px;padding:35px;
 background:#1b1e26;border:1px solid #414552;
 border-radius:22px
}

.login-box h1{text-align:center;margin:0}
.login-box span,header span{color:#a878ff}

.login-subtitle{
 text-align:center;color:#999;margin:10px 0 25px
}

#loginBtn{
 width:100%;margin-top:20px;
 background:#8b5cf6;color:white
}

#loginError{
 color:#ff7070;text-align:center;min-height:20px
}

header{
 padding:18px 25px;background:#171920;
 border-bottom:1px solid #363944;
 display:flex;justify-content:space-between;
 align-items:center;gap:20px
}

header h1{margin:0}

.user-area{
 display:flex;align-items:center;gap:15px
}

#userName{color:#ddd}

#userRole{
 color:#a98cff;font-weight:bold;
 font-size:13px;margin-top:4px
}

.logout{
 background:#454952;color:white
}

.container{
 max-width:1150px;margin:25px auto;padding:15px
}

.card{
 background:#181b22;border:1px solid #373a45;
 border-radius:18px;padding:24px;margin-bottom:22px
}

.card h2{margin-top:0}

.branch{
 border:1px solid #393d48;border-radius:15px;
 padding:18px;margin-top:18px;background:#14171d
}

.branch h3{
 color:#ad8aff;margin-top:0
}

.row{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px
}

.green{
 background:#059669;color:#fff;margin-top:18px
}

.purple{
 background:#8b5cf6;color:#fff;margin-top:18px
}

.gray{
 background:#4b4f59;color:white;margin-top:12px
}

.message{
 min-height:20px;margin-top:12px
}

.customer-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}

.ticket-card{
 background:#15181e;
 border:1px solid #393d47;
 border-radius:15px;
 padding:18px;
 margin-top:15px
}

.ticket-top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px
}

.ticket-top h3{
 margin:0;color:#cbb6ff
}

.ticket-badge{
 padding:5px 9px;
 border-radius:7px;
 background:#30234b;
 color:#c9b5ff;
 font-size:12px;
 font-weight:bold
}

.edit-btn{
 background:#8b5cf6!important;
 color:#fff!important;
 margin-top:15px;
 display:inline-block!important;
 visibility:visible!important;
 opacity:1!important
}

.summary-grid,.grand-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
 margin-top:20px
}

.summary-card,.grand-item,.stat{
 background:#22252d;
 border:1px solid #393d47;
 border-radius:12px;
 padding:18px
}

.summary-card h3{
 margin-top:0;color:#aaa
}

.summary-number{
 font-size:30px;
 font-weight:bold;
 margin-top:8px
}

.online-number{color:#4ade80}
.offline-number{color:#fbbf24}
.money-number{color:#60a5fa}
.total-number{color:#c084fc}

.host-branch{
 margin-top:20px;
 background:#14171d;
 border:1px solid #393d47;
 border-radius:16px;
 padding:20px
}

.host-branch-title{
 display:flex;
 justify-content:space-between;
 align-items:center
}

.host-branch-title h3{
 color:#c084fc
}

.branch-total{
 background:#8b5cf6;
 padding:7px 12px;
 border-radius:8px
}

.stats-row{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px
}

.stat-title{
 color:#aaa;font-size:13px
}

.stat-value{
 font-size:25px;
 font-weight:bold;
 margin-top:5px
}

.offline-details{
 margin-top:18px;
 border-top:1px solid #393d47;
 padding-top:15px
}

.offline-details h4{
 color:#fbbf24
}

.offline-item{
 display:flex;
 justify-content:space-between;
 background:#22252d;
 padding:12px;
 border-radius:9px;
 margin-top:8px
}

.offline-count{
 color:#fbbf24;
 font-weight:bold
}

.grand-total{
 margin-top:25px;
 padding:25px;
 border-radius:18px;
 border:1px solid #8b5cf6;
 background:#211b30
}

@media(max-width:800px){

 .row,
 .summary-grid,
 .grand-grid,
 .stats-row,
 .customer-grid{
  grid-template-columns:1fr
 }

 header{
  flex-direction:column;
  text-align:center
 }

 .ticket-top{
  flex-direction:column;
  align-items:flex-start
 }

}
</style>
</head>

<body>

 <div class="login-box">

<div

<!-- MY TICKETS -->

<div

>

</div>


<!-- SEARCH -->

<div

>

 <h2>Search Day</h2>

</div>


<!-- HOST -->

<div
 class="card hidden"
 id="hostDashboard"
>

 <h2>👑 Host Dashboard</h2>

 <input
  type="date"
  id="hostDate"
 >

 <div id="hostDashboardResults"></div>

  style="margin:30px 0;border-color:#333"
 >

<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://ubaooclkpgminlbifpjf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iNL7NMiqyDKAUCmUYNKqpQ_rpOi12EB";

const supabaseClient =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* ================================
   STATE
================================ */

let currentUser = null;
let currentBranch = "";
let isHost = false;
let editingTicketId = null;


/* ================================
   HELPERS
================================ */

function today(){

 const d = new Date();

 return (
  d.getFullYear() +
  "-" +
  String(d.getMonth()+1).padStart(2,"0") +
  "-" +
  String(d.getDate()).padStart(2,"0")
 );

}


function esc(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* ================================
   LOGIN
================================ */

async function login(){

 const email =
 document
 .getElementById("loginEmail")
 .value
 .trim();

 const password =
 document
 .getElementById("loginPassword")
 .value;

 const error =
 document
 .getElementById("loginError");

 const btn =
 document
 .getElementById("loginBtn");

 error.textContent = "";

 if(!email || !password){

  error.textContent =
  "Enter email and password.";

  return;

 }

 btn.disabled = true;

 btn.textContent =
 "Logging in...";


 try{

  const {
   data,
   error:loginError
  } =
  await supabaseClient.auth
  .signInWithPassword({
   email,
   password
  });

  if(loginError)
   throw loginError;

  await openWebsite(data.user);

 }catch(e){

  console.error(e);

  error.textContent =
  e.message ||
  "Login failed.";

 }finally{

  btn.disabled = false;

  btn.textContent =
  "Login";

 }

}


document
.getElementById("loginBtn")
.addEventListener(
 "click",
 login
);


document
.getElementById("loginPassword")
.addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   login();

 }
);


/* ================================
   PROFILE
================================ */

async function loadUserProfile(user){

 const {
  data,
  error
 } =
 await supabaseClient
 .from("branch_users")
 .select("branch")
 .eq("user_id",user.id)
 .maybeSingle();


 if(error)
  throw error;


 if(!data){

  throw new Error(
   "No branch profile found for this user."
  );

 }


 currentUser =
 user;

 currentBranch =
 String(
  data.branch || ""
 ).trim();


 isHost =
 currentBranch
 .toUpperCase() === "ALL";


 document
 .getElementById("userName")
 .textContent =
 user.email || "";


 document
 .getElementById("userRole")
 .textContent =
 isHost
 ? "HOST — ALL BRANCHES"
 : currentBranch;


/* HOST */

 if(isHost){

  document
  .getElementById(
   "branchSalesCard"
  )
  .classList.add("hidden");

  document
  .getElementById(
   "ticketHandoverCard"
  )
  .classList.add("hidden");

  document
  .getElementById(
   "branchTicketsCard"
  )
  .classList.add("hidden");

  document
  .getElementById(
   "searchCard"
  )
  .classList.add("hidden");

  document
  .getElementById(
   "hostDashboard"
  )
  .classList.remove("hidden");


 }else{

/* BRANCH */

  document
  .getElementById(
   "branchSalesCard"
  )
  .classList.remove("hidden");

  document
  .getElementById(
   "ticketHandoverCard"
  )
  .classList.remove("hidden");

  document
  .getElementById(
   "branchTicketsCard"
  )
  .classList.remove("hidden");

  document
  .getElementById(
   "searchCard"
  )
  .classList.remove("hidden");

  document
  .getElementById(
   "hostDashboard"
  )
  .classList.add("hidden");

  document
  .getElementById("branch")
  .value =
  currentBranch;

  document
  .getElementById("branch")
  .disabled =
  true;

 }

}


/* ================================
   OPEN WEBSITE
================================ */

async function openWebsite(user){

 await loadUserProfile(user);

 document
 .getElementById("loginScreen")
 .classList.add("hidden");

 document
 .getElementById("website")
 .classList.remove("hidden");


 [
  "date",
  "ticketDate",
  "myTicketsDate",
  "searchDate",
  "hostDate"
 ]
 .forEach(
  id=>{

   const el =
   document.getElementById(id);

   if(el)
    el.value =
    today();

  }
 );


 calculateOfflineCash();


 if(isHost)
  await loadHostDashboard();
 else
  await loadMyTickets();

}


/* ================================
   SESSION
================================ */

async function checkSession(){

 try{

  const {
   data,
   error
  } =
  await supabaseClient
  .auth
  .getSession();

  if(error)
   throw error;

  if(data.session){

   await openWebsite(
    data.session.user
   );

  }

 }catch(e){

  console.error(e);

 }

}


checkSession();


/* ================================
   LOGOUT
================================ */

document
.getElementById("logoutBtn")
.addEventListener(
 "click",
 async()=>{

  await supabaseClient
  .auth
  .signOut();

  location.reload();

 }
);


/* ================================
   OFFLINE CASH
================================ */

function calculateOfflineCash(){

 const premium =
 Number(
  document
  .getElementById(
   "offlinePremium"
  ).value || 0
 );

 const fanpit =
 Number(
  document
  .getElementById(
   "offlineFanpit"
  ).value || 0
 );

 const vip =
 Number(
  document
  .getElementById(
   "offlineVIP"
  ).value || 0
 );

 const high =
 Number(
  document
  .getElementById(
   "offlineHigh"
  ).value || 0
 );


 const total =
 premium * 1500 +
 fanpit * 1200 +
 vip * 800 +
 high * 500;


 document
 .getElementById(
  "offlineCash"
 )
 .value =
 total;


 return total;

}


[
 "offlinePremium",
 "offlineFanpit",
 "offlineVIP",
 "offlineHigh"
]
.forEach(
 id=>{

  document
  .getElementById(id)
  .addEventListener(
   "input",
   calculateOfflineCash
  );

 }
);


/* ================================
   SAVE SALES
================================ */

async function saveData(){

 if(isHost)
  return;


 const btn =
 document
 .getElementById(
  "saveDataBtn"
 );

 const msg =
 document
 .getElementById(
  "saveMessage"
 );

 const date =
 document
 .getElementById(
  "date"
 ).value;


 const data = {

  sale_date:date,

  branch:currentBranch,

  online_premium:
   Number(
    document
    .getElementById(
     "onlinePremium"
    ).value || 0
   ),

  online_fanpit:
   Number(
    document
    .getElementById(
     "onlineFanpit"
    ).value || 0
   ),

  online_vip:
   Number(
    document
    .getElementById(
     "onlineVIP"
    ).value || 0
   ),

  online_high_regular:
   Number(
    document
    .getElementById(
     "onlineHigh"
    ).value || 0
   ),

  offline_premium:
   Number(
    document
    .getElementById(
     "offlinePremium"
    ).value || 0
   ),

  offline_fanpit:
   Number(
    document
    .getElementById(
     "offlineFanpit"
    ).value || 0
   ),

  offline_vip:
   Number(
    document
    .getElementById(
     "offlineVIP"
    ).value || 0
   ),

  offline_high_regular:
   Number(
    document
    .getElementById(
     "offlineHigh"
    ).value || 0
   ),

  offline_cash:
   calculateOfflineCash()

 };


 btn.disabled = true;
 btn.textContent = "Saving...";


 try{

  const {
   data:existing,
   error:e1
  } =
  await supabaseClient
  .from("ticket_sales")
  .select("id")
  .eq("sale_date",date)
  .eq("branch",currentBranch)
  .maybeSingle();


  if(e1)
   throw e1;


  let result;


  if(existing){

   result =
   await supabaseClient
   .from("ticket_sales")
   .update(data)
   .eq(
    "id",
    existing.id
   );

  }else{

   result =
   await supabaseClient
   .from("ticket_sales")
   .insert([data]);

  }


  if(result.error)
   throw result.error;


  msg.style.color =
  "#4ade80";

  msg.textContent =
  "✓ Data saved successfully";


 }catch(e){

  console.error(e);

  msg.style.color =
  "#ff7070";

  msg.textContent =
  "❌ " + e.message;


 }finally{

  btn.disabled = false;
  btn.textContent = "Save Data";

 }

}


document
.getElementById("saveDataBtn")
.addEventListener(
 "click",
 saveData
);


/* ================================
   CLEAR TICKET FORM
================================ */

function clearTicketForm(){

 document
 .getElementById("customerName")
 .value = "";

 document
 .getElementById("orderNumber")
 .value = "";

 document
 .getElementById("ticketSerial")
 .value = "";

 document
 .getElementById("customerGmail")
 .value = "";

 document
 .getElementById("customerPhone")
 .value = "";

 document
 .getElementById("ticketType")
 .value =
 "Premium Orbit";

 document
 .getElementById("saleType")
 .value =
 "Online";

 editingTicketId =
 null;

 document
 .getElementById("saveTicketBtn")
 .textContent =
 "Save Ticket";

 document
 .getElementById("cancelEditBtn")
 .classList
 .add("hidden");

}


/* ================================
   SAVE / UPDATE TICKET
================================ */

async function saveTicket(){

 if(isHost)
  return;


 const msg =
 document
 .getElementById(
  "ticketMessage"
 );

 const btn =
 document
 .getElementById(
  "saveTicketBtn"
 );

 const date =
 document
 .getElementById(
  "ticketDate"
 ).value;

 const name =
 document
 .getElementById(
  "customerName"
 ).value.trim();

 const order =
 document
 .getElementById(
  "orderNumber"
 ).value.trim();

 const serial =
 document
 .getElementById(
  "ticketSerial"
 ).value.trim();

 const type =
 document
 .getElementById(
  "ticketType"
 ).value;

 const gmail =
 document
 .getElementById(
  "customerGmail"
 ).value.trim();

 const phone =
 document
 .getElementById(
  "customerPhone"
 ).value.trim();

 const saleType =
 document
 .getElementById(
  "saleType"
 ).value;


 if(
  !date ||
  !name ||
  !serial ||
  !gmail ||
  !phone
 ){

  msg.style.color =
  "#ff7070";

  msg.textContent =
  "Please fill all required fields.";

  return;

 }


 const ticket = {

  sale_date:date,
  branch:currentBranch,
  customer_name:name,
  order_number:order,
  serial:serial,
  ticket_type:type,
  gmail:gmail,
  phone:phone,
  sale_type:saleType

 };


 const wasEditing =
 Boolean(editingTicketId);


 btn.disabled = true;

 btn.textContent =
 wasEditing
 ? "Saving Changes..."
 : "Saving...";


 try{

  let result;


  if(wasEditing){

   result =
   await supabaseClient
   .from("ticket_handover")
   .update(ticket)
   .eq(
    "id",
    editingTicketId
   )
   .eq(
    "branch",
    currentBranch
   );

  }else{

   result =
   await supabaseClient
   .from("ticket_handover")
   .insert([
    ticket
   ]);

  }


  if(result.error)
   throw result.error;


  msg.style.color =
  "#4ade80";

  msg.textContent =
  wasEditing
  ? "✓ Customer updated successfully"
  : "✓ Ticket saved successfully";


  clearTicketForm();

  await loadMyTickets();


 }catch(e){

  console.error(e);

  msg.style.color =
  "#ff7070";

  msg.textContent =
  "❌ " + e.message;


 }finally{

  btn.disabled = false;
  btn.textContent =
  "Save Ticket";

 }

}


document
.getElementById("saveTicketBtn")
.addEventListener(
 "click",
 saveTicket
);

/* ================================
   HOST DASHBOARD
================================ */

async function loadHostDashboard(){

 if(!isHost)
  return;


 const date =
 document
 .getElementById(
  "hostDate"
 ).value;

 const container =
 document
 .getElementById(
  "hostDashboardResults"
 );


 container.innerHTML =
 "<p>Loading...</p>";


 try{

  const {
   data,
   error
  } =
  await supabaseClient
  .from("ticket_sales")
  .select("*")
  .eq(
   "sale_date",
   date
  );


  if(error)
   throw error;


  const branches = [
   "Zayed",
   "Zamalek",
   "Heliopolis",
   "CFC"
  ];


  let grandOnline = 0;
  let grandOffline = 0;
  let grandCash = 0;
  let html = "";


  branches.forEach(
   branch=>{

    const item =
    data?.find(
     x=>
      String(
       x.branch
      ).toLowerCase() ===
      branch.toLowerCase()
    );


    const online =
    item
    ?
    Number(
     item.online_premium || 0
    ) +
    Number(
     item.online_fanpit || 0
    ) +
    Number(
     item.online_vip || 0
    ) +
    Number(
     item.online_high_regular || 0
    )
    : 0;


    const offline =
    item
    ?
    Number(
     item.offline_premium || 0
    ) +
    Number(
     item.offline_fanpit || 0
    ) +
    Number(
     item.offline_vip || 0
    ) +
    Number(
     item.offline_high_regular || 0
    )
    : 0;


    const cash =
    item
    ?
    Number(
     item.offline_cash || 0
    )
    : 0;


    grandOnline += online;
    grandOffline += offline;
    grandCash += cash;


    html += `

    <div class="host-branch">

     <div class="host-branch-title">

      <h3>
       ${branch}
      </h3>

      <div class="branch-total">
       Total:
       ${online + offline}
      </div>

     </div>


     <div class="stats-row">

      <div class="stat">

       <div class="stat-title">
        Online
       </div>

       <div class="stat-value online-number">
        ${online}
       </div>

      </div>


      <div class="stat">

       <div class="stat-title">
        Offline
       </div>

       <div class="stat-value offline-number">
        ${offline}
       </div>

      </div>


      <div class="stat">

       <div class="stat-title">
        Cash
       </div>

       <div class="stat-value money-number">
        ${cash.toLocaleString()} EGP
       </div>

      </div>

     </div>


     <div class="offline-details">

      <h4>
       Offline Tickets
      </h4>

      <div class="offline-item">
       <span>Premium Orbit</span>
       <span class="offline-count">
        ${item?.offline_premium || 0}
       </span>
      </div>

      <div class="offline-item">
       <span>Fanpit</span>
       <span class="offline-count">
        ${item?.offline_fanpit || 0}
       </span>
      </div>

      <div class="offline-item">
       <span>VIP</span>
       <span class="offline-count">
        ${item?.offline_vip || 0}
       </span>
      </div>

      <div class="offline-item">
       <span>High Regular</span>
       <span class="offline-count">
        ${item?.offline_high_regular || 0}
       </span>
      </div>

     </div>

    </div>

    `;

   }
  );


  container.innerHTML = `

  <div class="summary-grid">

   <div class="summary-card">

    <h3>
     Total Online
    </h3>

    <div class="summary-number online-number">
     ${grandOnline}
    </div>

   </div>


   <div class="summary-card">

    <h3>
     Total Offline
    </h3>

    <div class="summary-number offline-number">
     ${grandOffline}
    </div>

   </div>


   <div class="summary-card">

    <h3>
     Total Tickets
    </h3>

    <div class="summary-number total-number">
     ${grandOnline + grandOffline}
    </div>

   </div>


   <div class="summary-card">

    <h3>
     Total Cash
    </h3>

    <div class="summary-number money-number">
     ${grandCash.toLocaleString()} EGP
    </div>

   </div>

  </div>


  ${html}


  <div class="grand-total">

   <h2>
    📊 Grand Total — ${date}
   </h2>

   <div class="grand-grid">

    <div class="grand-item">
     <div>Online</div>
     <div class="grand-value online-number">
      ${grandOnline}
     </div>
    </div>

    <div class="grand-item">
     <div>Offline</div>
     <div class="grand-value offline-number">
      ${grandOffline}
     </div>
    </div>

    <div class="grand-item">
     <div>All Tickets</div>
     <div class="grand-value total-number">
      ${grandOnline + grandOffline}
     </div>
    </div>

    <div class="grand-item">
     <div>Total Cash</div>
     <div class="grand-value money-number">
      ${grandCash.toLocaleString()} EGP
     </div>
    </div>

   </div>

  </div>

  `;


 }catch(e){

  console.error(e);

  container.innerHTML =
  `
   <p style="color:#ff7070">
    ❌ ${esc(e.message)}
   </p>
  `;

 }

}


document
.getElementById(
 "hostDate"
)
.addEventListener(
 "change",
 loadHostDashboard
);


/* ================================
   HOST CUSTOMER SEARCH
================================ */

async function hostCustomerSearch(){

 if(!isHost)
  return;


 const search =
 document
 .getElementById(
  "hostCustomerSearch"
 )
 .value
 .trim();


 const container =
 document
 .getElementById(
  "hostCustomerResults"
 );


 if(!search){

  container.innerHTML =
  "<p style='color:#aaa'>Write something to search.</p>";

  return;

 }


 container.innerHTML =
 "<p>Searching...</p>";


 try{

  const pattern =
  "%" + search + "%";


  const {
   data,
   error
  } =
  await supabaseClient
  .from("ticket_handover")
  .select("*")
  .or(
   "customer_name.ilike."+pattern+
   ",phone.ilike."+pattern+
   ",serial.ilike."+pattern+
   ",gmail.ilike."+pattern+
   ",order_number.ilike."+pattern
  )
  .order(
   "id",
   {
    ascending:false
   }
  )
  .limit(50);


  if(error)
   throw error;


  if(!data || !data.length){

   container.innerHTML =
   "<p style='color:#aaa'>No customer found.</p>";

   return;

  }


  container.innerHTML =
  data
  .map(
   ticket=>`

   <div class="ticket-card">

    <div class="ticket-top">

     <h3>
      ${esc(ticket.customer_name)}
     </h3>

     <span class="ticket-badge">
      ${esc(ticket.sale_type)}
     </span>

    </div>

    <br>

    <b>Branch:</b>
    ${esc(ticket.branch)}

    <br><br>

    <b>Date:</b>
    ${esc(ticket.sale_date)}

    <br>

    <b>Order:</b>
    ${esc(ticket.order_number) || "—"}

    <br>

    <b>Serial:</b>
    ${esc(ticket.serial)}

    <br>

    <b>Ticket:</b>
    ${esc(ticket.ticket_type)}

    <br>

    <b>Gmail:</b>
    ${esc(ticket.gmail)}

    <br>

    <b>Phone:</b>
    ${esc(ticket.phone)}

   </div>

   `
  )
  .join("");


 }catch(e){

  container.innerHTML =
  `
   <p style="color:#ff7070">
    ❌ ${esc(e.message)}
   </p>
  `;

 }

}


document
.getElementById(
 "hostSearchBtn"
)
.addEventListener(
 "click",
 hostCustomerSearch
);


document
.getElementById(

.addEventListener(
