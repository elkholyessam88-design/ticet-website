<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Ticket Branches</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:#17181c;
  color:white;
}

/* ================= LOGIN ================= */

#loginScreen{
  position:fixed;
  inset:0;
  z-index:9999;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:#17181c;
}

.loginBox{
  width:100%;
  max-width:420px;
  background:#202126;
  border:1px solid #444;
  border-radius:22px;
  padding:35px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.loginBox h1{
  text-align:center;
  margin:0 0 10px;
}

.subtitle{
  text-align:center;
  color:#999;
  margin-bottom:28px;
}

label{
  display:block;
  margin:15px 0 7px;
  color:#ddd;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #555;
  background:#303136;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus,select:focus{
  border-color:#8b5cf6;
}

#loginBtn{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#8b5cf6;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

#loginBtn:disabled{
  opacity:.6;
}

#loginError{
  min-height:20px;
  text-align:center;
  color:#ff6b6b;
}

/* ================= HEADER ================= */

.hidden{
  display:none!important;
}

header{
  padding:18px 30px;
  background:#202126;
  border-bottom:1px solid #444;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

header h1{
  margin:0;
  font-size:28px;
}

header h1 span{
  color:#8b5cf6;
}

#userArea{
  display:flex;
  align-items:center;
  gap:15px;
}

#userName{
  font-weight:bold;
}

#userRole{
  color:#9b7cff;
  font-size:13px;
}

.logout{
  background:#55565d;
  color:white;
}

/* ================= MAIN ================= */

.container{
  width:100%;
  max-width:1450px;
  margin:25px auto;
  padding:0 25px;
}

.card{
  background:#202126;
  border:1px solid #444;
  border-radius:18px;
  padding:25px;
  margin-bottom:25px;
}

.branch{
  background:#1c1d21;
  border:1px solid #444;
  border-radius:15px;
  padding:20px;
  margin-top:20px;
}

.branch h3{
  color:#9b7cff;
  margin-top:0;
}

.row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
}

.green{
  background:#008f68;
  color:white;
  margin-top:20px;
}

.success{
  color:#4ade80;
  font-weight:bold;
}

.error{
  color:#ff6b6b;
  font-weight:bold;
}

.result{
  line-height:1.8;
  font-size:16px;
}

.resultTotal{
  color:#4ade80;
  font-weight:bold;
}

/* ================= SAVE ANIMATION ================= */

#ticketSuccess{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.65);
}

.successBox{
  background:#202126;
  border:1px solid #444;
  border-radius:25px;
  padding:40px;
  text-align:center;
  animation:pop .45s ease;
}

.successIcon{
  width:80px;
  height:80px;
  margin:auto;
  border-radius:50%;
  background:#008f68;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  animation:scale .5s ease;
}

.successBox h2{
  margin-bottom:5px;
}

.successBox p{
  color:#aaa;
}

@keyframes pop{
  0%{
    transform:scale(.5);
    opacity:0;
  }
  70%{
    transform:scale(1.08);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

@keyframes scale{
  0%{transform:scale(0)}
  70%{transform:scale(1.15)}
  100%{transform:scale(1)}
}

/* ================= TABLET ================= */

@media(min-width:600px) and (max-width:999px){

  .row{
    grid-template-columns:repeat(2,1fr);
  }

  .container{
    padding:0 18px;
  }

}

/* ================= MOBILE ================= */

@media(max-width:599px){

  #loginScreen{
    padding:15px;
  }

  .loginBox{
    padding:28px 20px;
  }

  header{
    padding:15px;
    flex-direction:column;
    text-align:center;
  }

  header h1{
    font-size:23px;
  }

  #userArea{
    justify-content:center;
    flex-wrap:wrap;
  }

  .container{
    padding:0 10px;
    margin-top:15px;
  }

  .card{
    padding:16px;
  }

  .branch{
    padding:15px;
  }

  .row{
    grid-template-columns:1fr;
  }

  button{
    width:100%;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginScreen">

  <div class="loginBox">

    <h1>Tickets Website</h1>

    <div class="subtitle">
      Login to continue
    </div>

    <label>Email</label>

    <input
      id="loginEmail"
      type="email"
      placeholder="Enter email"
      autocomplete="username"
    >

    <label>Password</label>

    <input
      id="loginPassword"
      type="password"
      placeholder="Enter password"
      autocomplete="current-password"
    >

    <button id="loginBtn">
      Login

</div>


<!-- ================= SUCCESS POPUP ================= -->

<div id="ticketSuccess">

  <div class="successBox">

    <div class="successIcon">
      ✓
    </div>

    <h2>Ticket Saved!</h2>

    <p>Ticket handed over successfully.</p>

  </div>

</div>


<!-- ================= WEBSITE ================= -->

<div id="website" class="hidden">

<header>

  <h1>
    Ticket <span>Branches</span>
  </h1>

  <div id="userArea">

    <div>
      <div id="userName"></div>
      <div id="userRole"></div>
    </div>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </div>

</header>


<div class="container">


<!-- ================= TICKET HANDOVER ================= -->

<div class="card">

<h2>🎟️ Ticket Handover</h2>

<label>Date</label>

<input
  type="date"
  id="handoverDate"
>


<label>Customer Name</label>

<input
  type="text"
  id="customerName"
  placeholder="Enter customer name"
>


<label>Gmail</label>

<input
  type="email"
  id="customerGmail"
  placeholder="Enter Gmail"
>


<label>Ticket Serial</label>

<input
  type="text"
  id="ticketSerial"
  placeholder="Enter ticket serial"
>


<label>Ticket Type</label>

<select id="ticketType">

  <option value="">

  </option>

  <option value="Premium">
    Premium

    High Regular

  <option value="">

<!-- ================= SALES ================= -->

<div class="card">

<h2>Enter Ticket Sales</h2>

<label>Date</label>

<input
  type="date"
  id="date"
>

<label>Branch</label>

<select id="branch">

  <option>Zayed</option>
  <option>Zamalek</option>
  <option>Heliopolis</option>
  <option>CFC</option>

</select>


<div class="branch">

<h3>Online Tickets</h3>

<div class="row">

<div>
<label>Premium</label>
<input type="number" id="onlinePremium" value="0" min="0">
</div>

<div>
<label>Fanpit</label>
<input type="number" id="onlineFanpit" value="0" min="0">
</div>

<div>
<label>VIP</label>
<input type="number" id="onlineVIP" value="0" min="0">
</div>

<div>
<label>High Regular</label>
<input type="number" id="onlineHigh" value="0" min="0">
</div>

</div>
</div>


<div class="branch">

<h3>Offline Tickets</h3>

<div class="row">

<div>
<label>Premium</label>
<input type="number" id="offlinePremium" value="0" min="0">
</div>

<div>
<label>Fanpit</label>
<input type="number" id="offlineFanpit" value="0" min="0">
</div>

<div>
<label>VIP</label>
<input type="number" id="offlineVIP" value="0" min="0">

<div>
<label>High Regular</label>
<input type="number" id="offlineHigh" value="0" min="0">

<input
  type="number"
  id="offlineCash"

  min="0"
>

  onclick="saveData()"
>

</button>

<!-- ================= SEARCH ================= -->

<div class="card">

<h2>Search Day</h2>

<label>Select Date</label>

<input
  type="date"
  id="searchDate"
>

<button
  class="green"
  onclick="searchDay()"
>
  Show Day
</button>

<div id="results"></div>

</div>

</div>
</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://ubaooclkpgminlbifpjf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iNL7NMiqyDKAUCmUYNKqpQ_rpOi12EB";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentBranch = null;
let isAllUser = false;


/* =========================
   DEFAULT DATE
========================= */

function setToday(){

  const today =
    new Date().toISOString().split("T")[0];

  document.getElementById(
    "handoverDate"
  ).value = today;

  document.getElementById(
    "date"
  ).value = today;

  document.getElementById(
    "searchDate"
  ).value = today;
}


/* =========================
   LOGIN
========================= */

document.getElementById(
  "loginBtn"
).addEventListener(
  "click",
  login
);


async function login(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  const errorBox =
    document.getElementById(
      "loginError"
    );

  const button =
    document.getElementById(
      "loginBtn"
    );


  errorBox.textContent = "";


  if(!email || !password){

    errorBox.textContent =
      "Enter email and password.";

    return;
  }


  button.disabled = true;
  button.textContent = "Logging in...";


  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({
        email:email,
        password:password
      });


  if(error){

    errorBox.textContent =
      error.message;

    button.disabled = false;
    button.textContent = "Login";

    return;
  }


  currentUser =
    data.user;


  const {
    data:branchData,
    error:branchError
  } =
    await supabaseClient
      .from("branch_users")
      .select("branch")
      .eq(
        "user_id",
        data.user.id
      )
      .single();


  if(branchError || !branchData){

    errorBox.textContent =
      "Branch not found.";

    await supabaseClient.auth.signOut();

    button.disabled = false;
    button.textContent = "Login";

    return;
  }


  currentBranch =
    branchData.branch;

  isAllUser =
    currentBranch === "ALL";


  document.getElementById(
    "loginScreen"
  ).style.display = "none";


  document.getElementById(
    "website"
  ).classList.remove("hidden");


  document.getElementById(
    "userName"
  ).textContent =
    data.user.email;


  document.getElementById(
    "userRole"
  ).textContent =
    isAllUser
      ? "ALL BRANCHES"
      : currentBranch;


  const branchSelect =
    document.getElementById("branch");


  if(isAllUser){

    branchSelect.disabled = false;

  }else{

    branchSelect.value =
      currentBranch;

    branchSelect.disabled = true;

  }


  setToday();


  button.disabled = false;
  button.textContent = "Login";

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentBranch = null;
  isAllUser = false;


  document.getElementById(
    "website"
  ).classList.add("hidden");


  document.getElementById(
    "loginScreen"
  ).style.display = "flex";


  document.getElementById(
    "loginEmail"
  ).value = "";

  document.getElementById(
    "loginPassword"
  ).value = "";

}


/* =========================
   OFFLINE CASH
========================= */

function calculateOfflineCash(){

  const premium =
    Number(
      document.getElementById(
        "offlinePremium"
      ).value || 0
    );

  const fanpit =
    Number(
      document.getElementById(
        "offlineFanpit"
      ).value || 0
    );

  const vip =
    Number(
      document.getElementById(
        "offlineVIP"
      ).value || 0
    );

  const high =
    Number(
      document.getElementById(
        "offlineHigh"
      ).value || 0
    );


  const total =
    premium * 1500 +
    fanpit * 1200 +
    vip * 800 +
    high * 500;


  document.getElementById(
    "offlineCash"
  ).value = total;

}


[
  "offlinePremium",
  "offlineFanpit",
  "offlineVIP",
  "offlineHigh"
].forEach(id=>{

  document.getElementById(id)
    .addEventListener(
      "input",
      calculateOfflineCash
    );

});


/* =========================
   SAVE TICKET
========================= */

async function saveTicketHandover(){

  if(!currentUser){

    alert("Please login first.");
    return;

  }


  const date =
    document.getElementById(
      "handoverDate"
    ).value;

  const name =
    document.getElementById(
      "customerName"
    ).value.trim();

  const gmail =
    document.getElementById(
      "customerGmail"
    ).value.trim();

  const serial =
    document.getElementById(
      "ticketSerial"
    ).value.trim();

  const type =
    document.getElementById(
      "ticketType"
    ).value;

  const status =
    document.getElementById(
      "ticketStatus"
    ).value;

  const phone =
    document.getElementById(
      "customerPhone"
    ).value.trim();


  const message =
    document.getElementById(
      "handoverMessage"
    );


  if(
    !date ||
    !name ||
    !gmail ||
    !serial ||
    !type ||
    !status ||
    !phone
  ){

    message.textContent =
      "❌ Please fill all fields.";

    message.className =
      "error";

    return;
  }


  const branch =
    isAllUser
      ? document.getElementById(
          "branch"
        ).value
      : currentBranch;


  const {
    error
  } =
    await supabaseClient
      .from("ticket_handover")
      .insert([{

        handover_date:date,

        customer_name:name,

        gmail:gmail,

        ticket_serial:serial,

        ticket_type:type,

        ticket_status:status,

        phone:phone,

        branch:branch

      }]);


  if(error){

    message.textContent =
      "❌ " + error.message;

    message.className =
      "error";

    return;
  }


  /* SUCCESS ANIMATION */

  showTicketSuccess();


  /* CLEAR FORM */

  document.getElementById(
    "customerName"
  ).value = "";

  document.getElementById(
    "customerGmail"
  ).value = "";

  document.getElementById(
    "ticketSerial"
  ).value = "";

  document.getElementById(
    "ticketType"
  ).value = "";

  document.getElementById(
    "ticketStatus"
  ).value = "";

  document.getElementById(
    "customerPhone"
  ).value = "";


  setToday();

}


/* =========================
   SUCCESS ANIMATION + SOUND
========================= */

function showTicketSuccess(){

  const popup =
    document.getElementById(
      "ticketSuccess"
    );


  popup.style.display =
    "flex";


  /* Simple success sound */

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();


    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
      650,
      audio.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
      950,
      audio.currentTime + 0.12
    );


    gain.gain.setValueAtTime(
      0.0001,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.18,
      audio.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audio.currentTime + 0.25
    );


    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.25
    );

  }catch(e){}


  setTimeout(()=>{

    popup.style.display =
      "none";

  },1800);

}


/* =========================
   SAVE SALES
========================= */

async function saveData(){

  if(!currentUser){

    alert("Please login first.");
    return;

  }


  const date =
    document.getElementById(
      "date"
    ).value;


  if(!date){

    alert(
      "Please select a date."
    );

    return;
  }


  const branch =
    isAllUser
      ? document.getElementById(
          "branch"
        ).value
      : currentBranch;


  const data = {

    sale_date:date,

    branch:branch,

    online_premium:
      Number(
        document.getElementById(
          "onlinePremium"
        ).value || 0
      ),

    online_fanpit:
      Number(
        document.getElementById(
          "onlineFanpit"
        ).value || 0
      ),

    online_vip:
      Number(
        document.getElementById(
          "onlineVIP"
        ).value || 0
      ),

    online_high_regular:
      Number(
        document.getElementById(
          "onlineHigh"
        ).value || 0
      ),

    offline_premium:
      Number(
        document.getElementById(
          "offlinePremium"
        ).value || 0
      ),

    offline_fanpit:
      Number(
        document.getElementById(
          "offlineFanpit"
        ).value || 0
      ),

    offline_vip:
      Number(
        document.getElementById(
          "offlineVIP"
        ).value || 0
      ),

    offline_high_regular:
      Number(
        document.getElementById(
          "offlineHigh"
        ).value || 0
      ),

    offline_cash:
      Number(
        document.getElementById(
          "offlineCash"
        ).value || 0
      )

  };


  const {
    data:existing,
    error:findError
  } =
    await supabaseClient
      .from("ticket_sales")
      .select("id")
      .eq(
        "sale_date",
        date
      )
      .eq(
        "branch",
        branch
      )
      .maybeSingle();


  if(findError){

    document.getElementById(
      "saveMessage"
    ).textContent =
      "❌ " + findError.message;

    return;
  }


  let error;


  if(existing){

    const result =
      await supabaseClient
        .from("ticket_sales")
        .update(data)
        .eq(
          "id",
          existing.id
        );

    error =
      result.error;

  }else{

    const result =
      await supabaseClient
        .from("ticket_sales")
        .insert([data]);

    error =
      result.error;

  }


  if(error){

    document.getElementById(
      "saveMessage"
    ).textContent =
      "❌ " + error.message;

    return;
  }


  document.getElementById(
    "saveMessage"
  ).textContent =
    "✓ Data saved successfully";

}


/* =========================
   SEARCH DAY
========================= */

async function searchDay(){

  if(!currentUser){

    alert("Please login first.");
    return;

  }


  const date =
    document.getElementById(
      "searchDate"
    ).value;


  if(!date){

    alert(
      "Select a date first."
    );

    return;
  }


  const results =
    document.getElementById(
      "results"
    );


  let query =
    supabaseClient
      .from("ticket_sales")
      .select("*")
      .eq(
        "sale_date",
        date
      );


  if(!isAllUser){

    query =
      query.eq(
        "branch",
        currentBranch
      );

  }


  const {
    data,
    error
  } =
    await query.order(
      "branch"
    );


  if(error){

    results.innerHTML =
      "<p class='error'>❌ " +
      error.message +
      "</p>";

    return;
  }


  if(!data || data.length === 0){

    results.innerHTML =
      "<p>No data found.</p>";

    return;
  }


  let html = "";

  let totalOnline = 0;
  let totalOffline = 0;
  let totalCash = 0;


  data.forEach(item=>{

    const online =

      Number(
        item.online_premium || 0
      ) +

      Number(
        item.online_fanpit || 0
      ) +

      Number(
        item.online_vip || 0
      ) +

      Number(
        item.online_high_regular || 0
      );


    const offline =

      Number(
        item.offline_premium || 0
      ) +

      Number(
        item.offline_fanpit || 0
      ) +

      Number(
        item.offline_vip || 0
      ) +

      Number(
        item.offline_high_regular || 0
      );


    totalOnline += online;
    totalOffline += offline;

    totalCash +=
      Number(
        item.offline_cash || 0
      );


    html += `

      <div class="branch result">

        <h3>${item.branch}</h3>

        <b>Online Tickets:</b>
        ${online}

        <br><br>

        Premium:
        ${item.online_premium}

        |

        Fanpit:
        ${item.online_fanpit}

        |

        VIP:
        ${item.online_vip}

        |

        High Regular:
        ${item.online_high_regular}

        <br><br>

        <b>Offline Tickets:</b>
        ${offline}

        <br><br>

        Premium:
        ${item.offline_premium}

        |

        Fanpit:
        ${item.offline_fanpit}

        |

        VIP:
        ${item.offline_vip}

        |

        High Regular:
        ${item.offline_high_regular}

        <br><br>

        <b>Offline Cash:</b>
        ${item.offline_cash} EGP

      </div>

    `;

  });


  if(isAllUser){

    html += `

      <div class="branch resultTotal">

        TOTAL ALL BRANCHES

        <br><br>

        Online Tickets:
        ${totalOnline}

        <br>

        Offline Tickets:
        ${totalOffline}

        <br>

        Offline Cash:
        ${totalCash} EGP

      </div>

    `;

  }


  results.innerHTML =
    html;

}


/* =========================
   START
========================= */

setToday();
calculateOfflineCash();

</script>
