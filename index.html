<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at top right,#123b5a 0,#07131f 40%,#030a11 100%);
}

button,input,select{
    font-family:Arial,sans-serif;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:13px 14px;
    border:1px solid #29475d;
    border-radius:10px;
    outline:none;
    background:#102638;
    color:#fff;
}

input:focus,select:focus{
    border-color:#38bdf8;
    box-shadow:0 0 0 2px rgba(56,189,248,.12);
}

.hidden{
    display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginPage{
    min-height:100vh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background-image:
        linear-gradient(
            rgba(0,0,0,.30),
            rgba(0,0,0,.58)
        ),
        url("blue-orbit.jpg.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.loginBox{
    width:400px;
    max-width:95%;
    padding:40px 32px;
    text-align:center;

    background:rgba(4,14,24,.88);
    border:1px solid rgba(255,255,255,.15);
    border-radius:24px;

    backdrop-filter:blur(12px);

    box-shadow:
        0 30px 90px rgba(0,0,0,.7);
}

.loginLogo{
    width:180px;
    max-width:75%;
    margin-bottom:20px;
    border-radius:16px;
}

.loginBox h1{
    margin-bottom:22px;
    font-size:28px;
}

.loginBox input{
    margin:7px 0;
}

.loginBtn{
    width:100%;
    margin-top:12px;
    color:#fff;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);
}

.loginBtn:hover{
    background:linear-gradient(135deg,#0284c7,#1d4ed8);
}

.error{
    color:#ff7777;
    margin-top:12px;
    min-height:18px;
}

/* =========================
   APP
========================= */

#app{
    display:none;
    min-height:100vh;
}

.header{
    min-height:72px;
    padding:12px 28px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:linear-gradient(90deg,#071725,#0d2940);

    border-bottom:1px solid #29475d;

    position:sticky;
    top:0;
    z-index:50;

    box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.headerLogo{
    width:115px;
    height:auto;
    border-radius:10px;
}

.headerRight{
    display:flex;
    align-items:center;
    gap:14px;
    font-weight:bold;
}

#userBranch{
    color:#d8f3ff;
}

.logout{
    background:#ef4444;
    color:#fff;
}

.logout:hover{
    background:#dc2626;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:1450px;
    margin:auto;
    padding:28px;
}

.title{
    margin-bottom:22px;
    font-size:30px;
}

/* =========================
   DATE
========================= */

.dateBox{
    background:linear-gradient(145deg,#102b40,#0b1d2d);
    border:1px solid #29475d;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
}

.dateBox label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.dateInput{
    max-width:280px;
}

/* =========================
   SALE CARDS
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
}

.card{
    background:linear-gradient(145deg,#102b40,#0b1d2d);
    border:1px solid #29475d;
    padding:28px;
    border-radius:20px;
    cursor:pointer;
    transition:.25s;

    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.card:hover{
    transform:translateY(-4px);
    border-color:#38bdf8;
    box-shadow:0 15px 40px rgba(14,165,233,.18);
}

.card h2{
    margin-bottom:9px;
    font-size:24px;
}

.card p{
    color:#a8c1d1;
}

/* =========================
   FORM
========================= */

.formBox{
    margin-top:22px;

    background:linear-gradient(145deg,#102b40,#0b1d2d);

    border:1px solid #29475d;
    padding:25px;
    border-radius:20px;

    box-shadow:0 10px 35px rgba(0,0,0,.2);
}

.formBox h2{
    margin-bottom:18px;
}

.formGrid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
}

.priceBox{
    margin-top:16px;
    padding:16px;

    background:#071725;
    border:1px solid #29475d;
    border-radius:12px;

    font-size:17px;
    font-weight:bold;
    color:#d9f3ff;
}

.saveBtn{
    margin-top:16px;
    background:#22c55e;
    color:#fff;
}

.saveBtn:hover{
    background:#16a34a;
}

.cancelBtn{
    margin-top:16px;
    margin-left:8px;
    background:#475569;
    color:#fff;
}

/* =========================
   SEARCH
========================= */

.searchBox{
    margin-top:25px;

    background:linear-gradient(145deg,#102b40,#0b1d2d);

    border:1px solid #29475d;
    padding:22px;
    border-radius:20px;
}

.searchBox h2{
    margin-bottom:14px;
}

.searchHint{
    color:#8faabd;
    font-size:13px;
    margin-top:8px;
}

.searchResults{
    margin-top:15px;
}

.ticket{
    background:#071725;
    border:1px solid #29475d;
    padding:18px;
    margin-top:10px;
    border-radius:15px;
}

.ticketTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.ticketInfo{
    margin-top:10px;
    line-height:1.8;
}

.ticketActions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.editBtn{
    background:#f59e0b;
    color:#111827;
}

.deleteBtn{
    background:#dc2626;
    color:#fff;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    background:#164e63;
    margin-top:7px;
    margin-right:5px;
    font-size:13px;
}

/* =========================
   HOST
========================= */

.hostPanel{
    margin-top:32px;
}

.hostTitle{
    margin-bottom:18px;
    font-size:28px;
}

.hostFilters{
    background:linear-gradient(145deg,#102b40,#0b1d2d);
    border:1px solid #29475d;
    padding:20px;
    border-radius:18px;
    margin-bottom:22px;
}

.hostFilters label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.hostDate{
    max-width:280px;
}

/* =========================
   PRICE LIST
========================= */

.priceList{
    margin-bottom:22px;

    background:linear-gradient(145deg,#102b40,#0b1d2d);

    border:1px solid #29475d;
    padding:20px;
    border-radius:18px;
}

.priceList h3{
    margin-bottom:12px;
}

.priceGrid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
}

.priceItem{
    background:#071725;
    border:1px solid #29475d;
    padding:15px;
    border-radius:12px;
    text-align:center;
    line-height:1.6;
}

/* =========================
   TABLES
========================= */

.branchCard{
    background:linear-gradient(145deg,#102b40,#0b1d2d);

    border:1px solid #29475d;
    padding:22px;
    border-radius:20px;
    margin-bottom:24px;

    box-shadow:0 10px 35px rgba(0,0,0,.2);

    overflow:hidden;
}

.branchHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.branchHeader h3{
    font-size:24px;
}

.branchCash{
    background:#064e3b;
    border:1px solid #047857;
    padding:8px 13px;
    border-radius:20px;
    color:#bbf7d0;
    font-weight:bold;
}

.tableTitle{
    margin-top:20px;
    margin-bottom:10px;
    font-size:19px;
    color:#d8f3ff;
}

.tableWrapper{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    margin-bottom:20px;
    border-radius:12px;
}

.summaryTable{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
}

.summaryTable th,
.summaryTable td{
    border:1px solid #294154;
    padding:12px;
    text-align:center;
}

.summaryTable th{
    background:#071725;
    color:#cceeff;
}

.summaryTable td{
    background:#102b40;
}

.summaryTable .totalRow td{
    background:#12354a;
    font-weight:bold;
}

.cash{
    color:#4ade80;
    font-weight:bold;
}

/* =========================
   GRAND TOTAL
========================= */

.grandTotal{
    margin-top:28px;

    background:linear-gradient(145deg,#0b1d2c,#071725);

    border:1px solid #2a465c;
    padding:25px;
    border-radius:20px;
    overflow:hidden;
}

.grandTotal h2{
    margin-bottom:18px;
}

.grandTable{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
}

.grandTable th,
.grandTable td{
    border:1px solid #294154;
    padding:13px;
    text-align:center;
}

.grandTable th{
    background:#102b40;
}

.grandTable td{
    background:#0d2233;
}

.grandTable .grandRow td{
    background:#164e63;
    font-weight:bold;
    font-size:17px;
}

/* =========================
   STATUS
========================= */

.status{
    margin-top:15px;
    padding:12px 15px;
    border-radius:10px;
    display:none;
    font-weight:bold;
}

.status.success{
    display:block;
    background:#064e3b;
    border:1px solid #047857;
    color:#bbf7d0;
}

.status.error{
    display:block;
    background:#450a0a;
    border:1px solid #991b1b;
    color:#fecaca;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .container{
        padding:20px;
    }

    .priceGrid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }
}

@media(max-width:700px){

    .header{
        padding:10px 14px;
    }

    .headerLogo{
        width:90px;
    }

    .headerRight{
        gap:8px;
        font-size:13px;
    }

    .logout{
        padding:9px 12px;
    }

    .container{
        padding:15px;
    }

    .title{
        font-size:25px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .formGrid{
        grid-template-columns:1fr;
    }

    .priceGrid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .branchCard{
        padding:15px;
    }

    .branchHeader h3{
        font-size:21px;
    }

    .loginBox{
        padding:30px 22px;
    }
}

@media(max-width:420px){

    .priceGrid{
        grid-template-columns:1fr;
    }

    .ticketTop{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<section id="loginPage">

    <div class="loginBox">

        <img
            src="blue-orbit.jpg.jpeg"
            class="loginLogo"
            alt="Logo"
            onerror="this.style.display='none';"
        >

        <h1>Ticket Management</h1>

        <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
        >

        <button
            class="loginBtn"
            onclick="login()"
        >
            LOGIN
        </button>

        <div id="loginError" class="error"></div>

    </div>

</section>

<section id="app">

<header class="header">

    <img
        src="blue-orbit.jpg.jpeg"
        class="headerLogo"
        alt="Logo"
    >

    <div class="headerRight">

        <span id="userBranch"></span>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>

<main class="container">

    <h1 class="title">Ticket Management</h1>

    <div id="branchDateBox" class="dateBox">

        <label>Sale Date</label>

        <input
            id="saleDate"
            class="dateInput"
            type="date"
        >

    </div>

    <div id="saleCards" class="cards">

        <div
            class="card"
            onclick="chooseSale('Online')"
        >
            <h2>ONLINE</h2>
            <p>Online Ticket Sale</p>
        </div>

        <div
            class="card"
            onclick="chooseSale('Offline')"
        >
            <h2>OFFLINE</h2>
            <p>Offline Ticket Sale</p>
        </div>

    </div>

    <div id="formBox" class="formBox hidden">

        <h2 id="formTitle">Ticket Handover</h2>

        <div class="formGrid">

            <input id="customerName" placeholder="Customer Name">

            <input
                id="orderNumber"
                placeholder="Order Number"
                autocomplete="off"
            >

            <input id="serial" placeholder="Serial">

            <select id="ticketType">

                <option value="">Ticket Type</option>
                <option value="Premium">Premium</option>
                <option value="Fanpit">Fanpit</option>
                <option value="VIP">VIP</option>
                <option value="Regular">Regular</option>

            </select>

            <input
                id="gmail"
                type="email"
                placeholder="Gmail"
            >

            <input id="phone" placeholder="Phone">

            <select id="saleType">

                <option value="">Sale Type</option>
                <option value="Online">Online</option>
                <option value="Offline">Offline</option>

            </select>

            <input
                id="quantity"
                type="number"
                min="1"
                value="1"
                placeholder="Quantity"
                oninput="updatePrice()"
            >

        </div>

        <div id="priceBox" class="priceBox">
            Online sale — No cash
        </div>

        <button class="saveBtn" onclick="saveTicket()">
            SAVE
        </button>

        <button class="cancelBtn" onclick="cancelEdit()">
            CANCEL
        </button>

        <div id="saveStatus" class="status"></div>

    </div>

    <div class="searchBox">

        <h2>Search Tickets</h2>

        <input
            id="search"
            placeholder="Search by Date / Order Number / Phone / Customer / Gmail / Serial"
            oninput="searchTickets()"
        >

        <div class="searchHint">
            Date example: 2026-08-12
        </div>

        <div id="searchResults" class="searchResults"></div>

    </div>

    <div id="hostPanel" class="hostPanel hidden">

        <h2 class="hostTitle">HOST DASHBOARD</h2>

        <div class="hostFilters">

            <label>Report Date</label>

            <input
                id="hostDate"
                class="hostDate"
                type="date"
                onchange="loadHostDashboard()"
            >

        </div>

        <div class="priceList">

            <h3>Current Offline Prices</h3>

            <div class="priceGrid">

                <div class="priceItem">
                    <b>Premium</b><br>
                    1,500 EGP
                </div>

                <div class="priceItem">
                    <b>Fanpit</b><br>
                    1,200 EGP
                </div>

                <div class="priceItem">
                    <b>VIP</b><br>
                    1,000 EGP
                </div>

                <div class="priceItem">
                    <b>Regular</b><br>
                    600 EGP
                </div>

            </div>

        </div>

        <div id="hostResults"></div>

        <div id="grandTotal" class="grandTotal"></div>

    </div>

</main>

</section>

<script>

const SUPABASE_URL =
    "https://fpfsgxrsppwpesritsva.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_dHEyax8rhZKR4A1Ie8BmKw_ttSL2dZ3";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

let currentUser = null;
let currentBranch = null;
let editingId = null;

const PRICES = {
    Premium:1500,
    Fanpit:1200,
    VIP:1000,
    Regular:600
};

function today(){

    const d = new Date();

    const year = d.getFullYear();

    const month =
        String(d.getMonth()+1).padStart(2,"0");

    const day =
        String(d.getDate()).padStart(2,"0");

    return `${year}-${month}-${day}`;
}

document.getElementById("saleDate").value = today();
document.getElementById("hostDate").value = today();

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("loginError");

    error.textContent = "";

    if(!email || !password){

        error.textContent =
            "Enter email and password.";

        return;
    }

    const {
        data,
        error:loginError
    } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if(loginError){

        error.textContent =
            loginError.message;

        return;
    }

    currentUser = data.user;

    await loadUser();
}

async function loadUser(){

    if(!currentUser) return;

    const {
        data,
        error
    } =
        await supabaseClient
        .from("branch_users")
        .select("name,branch")
        .eq("user_id",currentUser.id)
        .single();

    if(error){

        alert("User branch was not found.");

        await logout();

        return;
    }

    currentBranch = data.branch;

    document.getElementById("userBranch").textContent =
        `${data.name} — ${data.branch}`;

    document.getElementById("loginPage").style.display = "none";

    document.getElementById("app").style.display = "block";

    if(currentBranch === "ALL"){

        document.getElementById("saleCards").classList.add("hidden");

        document.getElementById("branchDateBox").classList.add("hidden");

        document.getElementById("formBox").classList.add("hidden");

        document.getElementById("hostPanel").classList.remove("hidden");

        await loadHostDashboard();
    }
}

async function logout(){

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentBranch = null;
    editingId = null;

    document.getElementById("app").style.display = "none";

    document.getElementById("loginPage").style.display = "flex";

    document.getElementById("loginError").textContent = "";
}

function chooseSale(type){

    if(currentBranch === "ALL"){

        alert("HOST cannot create tickets.");

        return;
    }

    editingId = null;

    document.getElementById("formBox")
        .classList.remove("hidden");

    document.getElementById("formTitle")
        .textContent =
        `Ticket Handover — ${type}`;

    document.getElementById("saleType").value = type;

    updatePrice();
}

function updatePrice(){

    const saleType =
        document.getElementById("saleType").value;

    const category =
        document.getElementById("ticketType").value;

    const quantity =
        Number(
            document.getElementById("quantity").value
        ) || 1;

    const priceBox =
        document.getElementById("priceBox");

    if(saleType !== "Offline"){

        priceBox.textContent =
            "Online sale — No cash";

        return;
    }

    if(!category){

        priceBox.textContent =
            "Choose ticket category";

        return;
    }

    const price = PRICES[category] || 0;

    const total = price * quantity;

    priceBox.innerHTML =
        `Price: ${price.toLocaleString()} EGP × ${quantity} = <b>${total.toLocaleString()} EGP</b>`;
}

document.getElementById("saleType")
    .addEventListener("change",updatePrice);

document.getElementById("ticketType")
    .addEventListener("change",updatePrice);

async function saveTicket(){

    if(currentBranch === "ALL"){

        showStatus(
            "saveStatus",
            "HOST cannot save tickets.",
            false
        );

        return;
    }

    const customerName =
        document.getElementById("customerName").value.trim();

    const orderNumber =
        document.getElementById("orderNumber").value.trim();

    const serial =
        document.getElementById("serial").value.trim();

    const category =
        document.getElementById("ticketType").value;

    const gmail =
        document.getElementById("gmail").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const saleType =
        document.getElementById("saleType").value;

    const quantity =
        Number(document.getElementById("quantity").value);

    const saleDate =
        document.getElementById("saleDate").value;

    if(
        !customerName ||
        !orderNumber ||
        !serial ||
        !category ||
        !gmail ||
        !phone ||
        !saleType ||
        !quantity ||
        quantity < 1 ||
        !saleDate
    ){

        showStatus(
            "saveStatus",
            "Please fill all required fields.",
            false
        );

        return;
    }

    let oldTicket = null;

    if(editingId){

        const {data} =
            await supabaseClient
            .from("tickets")
            .select("price,amount,sale_type,quantity")
            .eq("id",editingId)
            .eq("branch",currentBranch)
            .single();

        oldTicket = data;
    }

    let unitPrice;
    let amount;

    if(editingId && oldTicket){

        unitPrice =
            Number(oldTicket.price || 0);

        amount =
            oldTicket.sale_type === "Offline"
            ? unitPrice * quantity
            : 0;

    }else{

        unitPrice =
            saleType === "Offline"
            ? Number(PRICES[category] || 0)
            : 0;

        amount =
            saleType === "Offline"
            ? unitPrice * quantity
            : 0;
    }

    const ticketData = {

        branch:currentBranch,
        sale_type:saleType,
        quantity,
        customer_name:customerName,
        order_number:orderNumber,
        serial,
        ticket_type:category,
        category,
        gmail,
        phone,
        sale_date:saleDate,
        price:unitPrice,
        amount,
        created_by:currentUser.id,
        updated_at:new Date().toISOString()
    };

    let result;

    if(editingId){

        result =
            await supabaseClient
            .from("tickets")
            .update(ticketData)
            .eq("id",editingId)
            .eq("branch",currentBranch);

    }else{

        result =
            await supabaseClient
            .from("tickets")
            .insert([ticketData]);
    }

    if(result.error){

        showStatus(
            "saveStatus",
            "Save unsuccessful: " +
            result.error.message,
            false
        );

        return;
    }

    const wasEditing = Boolean(editingId);

    showStatus(
        "saveStatus",
        wasEditing
        ? "Ticket updated successfully."
        : "Ticket created successfully.",
        true
    );

    clearForm();

    document.getElementById("formBox")
        .classList.add("hidden");

    await searchTickets();
}

function showStatus(elementId,message,success){

    const box =
        document.getElementById(elementId);

    if(!box) return;

    box.textContent = message;

    box.className =
        "status " +
        (success ? "success" : "error");

    setTimeout(
        () => {
            box.className = "status";
        },
        5000
    );
}

function clearForm(){

    editingId = null;

    document.getElementById("customerName").value = "";
    document.getElementById("orderNumber").value = "";
    document.getElementById("serial").value = "";
    document.getElementById("ticketType").value = "";
    document.getElementById("gmail").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("saleType").value = "";
    document.getElementById("quantity").value = "1";

    updatePrice();
}

function cancelEdit(){

    clearForm();

    document.getElementById("formBox")
        .classList.add("hidden");
}

function editTicket(ticket){

    if(currentBranch === "ALL"){

        alert("HOST cannot edit tickets.");

        return;
    }

    if(ticket.branch !== currentBranch){

        alert(
            "You can only edit tickets from your branch."
        );

        return;
    }

    editingId = ticket.id;

    document.getElementById("formBox")
        .classList.remove("hidden");

    document.getElementById("formTitle")
        .textContent = "Edit Ticket";

    document.getElementById("customerName").value =
        ticket.customer_name || "";

    document.getElementById("orderNumber").value =
        ticket.order_number || "";

    document.getElementById("serial").value =
        ticket.serial || "";

    document.getElementById("ticketType").value =
        ticket.category ||
        ticket.ticket_type ||
        "";

    document.getElementById("gmail").value =
        ticket.gmail || "";

    document.getElementById("phone").value =
        ticket.phone || "";

    document.getElementById("saleType").value =
        ticket.sale_type || "";

    document.getElementById("quantity").value =
        ticket.quantity || 1;

    document.getElementById("saleDate").value =
        ticket.sale_date || today();

    updatePrice();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

async function deleteTicket(ticketId){

    if(currentBranch === "ALL"){

        alert("HOST cannot delete tickets.");

        return;
    }

    if(!ticketId){

        alert("Delete unsuccessful.");

        return;
    }

    if(!confirm(
        "Are you sure you want to permanently delete this ticket?"
    )) return;

    const {error} =
        await supabaseClient
        .from("tickets")
        .delete()
        .eq("id",ticketId)
        .eq("branch",currentBranch);

    if(error){

        alert(
            "Delete unsuccessful:\n" +
            error.message
        );

        return;
    }

    alert("Delete successful.");

    editingId = null;

    document.getElementById("formBox")
        .classList.add("hidden");

    clearForm();

    await searchTickets();
}

async function searchTickets(){

    const search =
        document.getElementById("search")
        .value
        .trim();

    if(!search){

        document.getElementById("searchResults")
            .innerHTML = "";

        return;
    }

    let query =
        supabaseClient
        .from("tickets")
        .select("*");

    if(
        currentBranch &&
        currentBranch !== "ALL"
    ){

        query =
            query.eq(
                "branch",
                currentBranch
            );
    }

    const safeSearch =
        search.replaceAll(",","");

    if(
        /^\d{4}-\d{2}-\d{2}$/.test(safeSearch)
    ){

        query =
            query.eq(
                "sale_date",
                safeSearch
            );

    }else{

        query =
            query.or(
                `phone.ilike.%${safeSearch}%,` +
                `customer_name.ilike.%${safeSearch}%,` +
                `gmail.ilike.%${safeSearch}%,` +
                `serial.ilike.%${safeSearch}%,` +
                `order_number.ilike.%${safeSearch}%`
            );
    }

    query =
        query.order(
            "created_at",
            {
                ascending:false
            }
        );

    const {data,error} =
        await query;

    if(error){

        document.getElementById("searchResults")
            .innerHTML =
            `<p>${escapeHTML(error.message)}</p>`;

        return;
    }

    renderTickets(data || []);
}

function renderTickets(tickets){

    const container =
        document.getElementById("searchResults");

    if(!tickets.length){

        container.innerHTML =
            "<p>No tickets found.</p>";

        return;
    }

    container.innerHTML =
        tickets.map(ticket => {

            const category =
                ticket.category ||
                ticket.ticket_type ||
                "";

            const oldPrice =
                Number(ticket.price || 0);

            const amount =
                Number(ticket.amount || 0);

            return `
            <div class="ticket">

                <div class="ticketTop">

                    <strong>
                        ${escapeHTML(ticket.customer_name)}
                    </strong>

                    <div class="ticketActions">

                        ${
                            currentBranch !== "ALL"
                            ?
                            `
                            <button
                                class="editBtn"
                                onclick='editTicket(${JSON.stringify(ticket)})'
                            >
                                EDIT
                            </button>

                            <button
                                class="deleteBtn"
                                onclick="deleteTicket('${ticket.id}')"
                            >
                                DELETE
                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                </div>

                <span class="badge">
                    Branch: ${escapeHTML(ticket.branch)}
                </span>

                <span class="badge">
                    ${escapeHTML(ticket.sale_type)}
                </span>

                <span class="badge">
                    ${escapeHTML(category)}
                </span>

                <div class="ticketInfo">

                    <div>
                        <b>Order Number:</b>
                        ${escapeHTML(ticket.order_number || "-")}
                    </div>

                    <div>
                        <b>Date:</b>
                        ${escapeHTML(ticket.sale_date || "-")}
                    </div>

                    <div>
                        <b>Serial:</b>
                        ${escapeHTML(ticket.serial || "-")}
                    </div>

                    <div>
                        <b>Gmail:</b>
                        ${escapeHTML(ticket.gmail || "-")}
                    </div>

                    <div>
                        <b>Phone:</b>
                        ${escapeHTML(ticket.phone || "-")}
                    </div>

                    <div>
                        <b>Quantity:</b>
                        ${Number(ticket.quantity || 0)}
                    </div>

                    <div>
                        <b>Saved Unit Price:</b>
                        ${oldPrice.toLocaleString()} EGP
                    </div>

                    <div>
                        <b>Saved Amount:</b>
                        ${amount.toLocaleString()} EGP
                    </div>

                </div>

            </div>
            `;
        }).join("");
}

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

async function loadHostDashboard(){

    if(currentBranch !== "ALL") return;

    const date =
        document.getElementById("hostDate").value;

    if(!date) return;

    const hostResults =
        document.getElementById("hostResults");

    hostResults.innerHTML =
        "<p>Loading...</p>";

    const {data,error} =
        await supabaseClient
        .from("tickets")
        .select("*")
        .eq("sale_date",date)
        .order(
            "created_at",
            {
                ascending:true
            }
        );

    if(error){

        hostResults.innerHTML =
            `
            <div class="status error">
                ${escapeHTML(error.message)}
            </div>
            `;

        return;
    }

    renderHostDashboard(data || [],date);
}

function renderHostDashboard(tickets,date){

    const branches = [
        "Zayed",
        "Zamalek",
        "Heliopolis",
        "CFC"
    ];

    const hostResults =
        document.getElementById("hostResults");

    let grandOnline = 0;
    let grandOffline = 0;
    let grandOfflineCash = 0;

    let html = "";

    branches.forEach(branch => {

        const branchTickets =
            tickets.filter(
                ticket => ticket.branch === branch
            );

        let onlineTickets = 0;
        let offlineTickets = 0;
        let offlineCash = 0;

        const categories = {

            Premium:{online:0,offline:0,cash:0},
            Fanpit:{online:0,offline:0,cash:0},
            VIP:{online:0,offline:0,cash:0},
            Regular:{online:0,offline:0,cash:0}

        };

        branchTickets.forEach(ticket => {

            const category =
                normalizeCategory(
                    ticket.category ||
                    ticket.ticket_type
                );

            const quantity =
                Number(ticket.quantity || 0);

            const amount =
                Number(ticket.amount || 0);

            if(ticket.sale_type === "Online"){

                onlineTickets += quantity;

                if(categories[category]){
                    categories[category].online += quantity;
                }

            }else if(ticket.sale_type === "Offline"){

                offlineTickets += quantity;

                offlineCash += amount;

                if(categories[category]){

                    categories[category].offline += quantity;

                    categories[category].cash += amount;
                }
            }
        });

        grandOnline += onlineTickets;
        grandOffline += offlineTickets;
        grandOfflineCash += offlineCash;

        html += `
        <div class="branchCard">

            <div class="branchHeader">

                <h3>${escapeHTML(branch)}</h3>

                <div class="branchCash">
                    Offline Cash:
                    ${offlineCash.toLocaleString()} EGP
                </div>

            </div>

            <div class="tableTitle">
                Ticket Summary
            </div>

            <div class="tableWrapper">

                <table class="summaryTable">

                    <thead>

                        <tr>
                            <th>Ticket</th>
                            <th>Online</th>
                            <th>Offline</th>
                            <th>Offline Cash</th>
                            <th>Total Tickets</th>
                        </tr>

                    </thead>

                    <tbody>

                        ${renderCategoryRow(
                            "Premium",
                            categories.Premium
                        )}

                        ${renderCategoryRow(
                            "Fanpit",
                            categories.Fanpit
                        )}

                        ${renderCategoryRow(
                            "VIP",
                            categories.VIP
                        )}

                        ${renderCategoryRow(
                            "Regular",
                            categories.Regular
                        )}

                        <tr class="totalRow">

                            <td>TOTAL</td>

                            <td>
                                ${onlineTickets.toLocaleString()}
                            </td>

                            <td>
                                ${offlineTickets.toLocaleString()}
                            </td>

                            <td class="cash">
                                ${offlineCash.toLocaleString()} EGP
                            </td>

                            <td>
                                ${
                                    (
                                        onlineTickets +
                                        offlineTickets
                                    ).toLocaleString()
                                }
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="tableTitle">
                Tickets Details
            </div>

            <div class="tableWrapper">

                <table class="summaryTable">

                    <thead>

                        <tr>
                            <th>Date</th>
                            <th>Order Number</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Gmail</th>
                            <th>Serial</th>
                            <th>Ticket</th>
                            <th>Sale</th>
                            <th>Qty</th>
                            <th>Saved Price</th>
                            <th>Amount</th>
                        </tr>

                    </thead>

                    <tbody>

                        ${
                            branchTickets.length
                            ?
                            branchTickets
                                .map(
                                    ticket =>
                                        renderHostTicketRow(ticket)
                                )
                                .join("")
                            :
                            `
                            <tr>
                                <td colspan="11">
                                    No tickets for this branch.
                                </td>
                            </tr>
                            `
                        }

                    </tbody>

                </table>

            </div>

        </div>
        `;
    });

    if(!html){

        html =
            `
            <div class="status success">
                No tickets found for ${escapeHTML(date)}.
            </div>
            `;
    }

    hostResults.innerHTML = html;

    renderGrandTotal(
        grandOnline,
        grandOffline,
        grandOfflineCash
    );
}

function renderCategoryRow(name,values){

    const total =
        values.online +
        values.offline;

    return `
    <tr>

        <td>${escapeHTML(name)}</td>

        <td>${values.online.toLocaleString()}</td>

        <td>${values.offline.toLocaleString()}</td>

        <td class="cash">
            ${values.cash.toLocaleString()} EGP
        </td>

        <td>${total.toLocaleString()}</td>

    </tr>
    `;
}

function renderHostTicketRow(ticket){

    const category =
        normalizeCategory(
            ticket.category ||
            ticket.ticket_type
        );

    const quantity =
        Number(ticket.quantity || 0);

    const price =
        Number(ticket.price || 0);

    const amount =
        Number(ticket.amount || 0);

    return `
    <tr>

        <td>${escapeHTML(ticket.sale_date || "-")}</td>

        <td>${escapeHTML(ticket.order_number || "-")}</td>

        <td>${escapeHTML(ticket.customer_name || "-")}</td>

        <td>${escapeHTML(ticket.phone || "-")}</td>

        <td>${escapeHTML(ticket.gmail || "-")}</td>

        <td>${escapeHTML(ticket.serial || "-")}</td>

        <td>${escapeHTML(category || "-")}</td>

        <td>${escapeHTML(ticket.sale_type || "-")}</td>

        <td>${quantity.toLocaleString()}</td>

        <td>${price.toLocaleString()} EGP</td>

        <td class="cash">
            ${amount.toLocaleString()} EGP
        </td>

    </tr>
    `;
}

function renderGrandTotal(online,offline,offlineCash){

    const grandTotal =
        document.getElementById("grandTotal");

    const totalTickets =
        online + offline;

    grandTotal.innerHTML = `

        <h2>GRAND TOTAL</h2>

        <div class="tableWrapper">

            <table class="grandTable">

                <thead>

                    <tr>
                        <th>Total Online</th>
                        <th>Total Offline</th>
                        <th>Total Offline Cash</th>
                        <th>Total Tickets</th>
                    </tr>

                </thead>

                <tbody>

                    <tr class="grandRow">

                        <td>${online.toLocaleString()}</td>

                        <td>${offline.toLocaleString()}</td>

                        <td class="cash">
                            ${offlineCash.toLocaleString()} EGP
                        </td>

                        <td>${totalTickets.toLocaleString()}</td>

                    </tr>

                </tbody>

            </table>

        </div>
    `;
}

function normalizeCategory(category){

    if(!category) return "";

    const value =
        String(category)
        .trim()
        .toLowerCase();

    if(value === "fanbit" || value === "fanpit"){
        return "Fanpit";
    }

    if(value === "premium"){
        return "Premium";
    }

    if(value === "vip"){
        return "VIP";
    }

    if(value === "regular"){
        return "Regular";
    }

    return category;
}

async function checkSession(){

    const {data} =
        await supabaseClient.auth.getSession();

    if(
        data &&
        data.session &&
        data.session.user
    ){

        currentUser =
            data.session.user;

        await loadUser();
    }
}

supabaseClient.auth.onAuthStateChange(
    async(event,session) => {

        if(event === "SIGNED_IN"){

            if(session && session.user){

                currentUser =
                    session.user;

                await loadUser();
            }
        }

        if(event === "SIGNED_OUT"){

            currentUser = null;
            currentBranch = null;
        }
    }
);

document.getElementById("password")
    .addEventListener(
        "keydown",
        event => {

            if(event.key === "Enter"){
                login();
            }

        }
    );

document.getElementById("search")
    .addEventListener(
        "keydown",
        event => {

            if(event.key === "Enter"){
                searchTickets();
            }

        }
    );

checkSession();
